services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - BOOKTALK_HOST=0.0.0.0
      - PORT=8000
    volumes:
      - booktalk-data:/app/data
      - hf-cache:/root/.cache/huggingface
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BOOKTALK_DOMAIN=${BOOKTALK_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  booktalk-data:
  hf-cache:
  caddy-data:
  caddy-config:
