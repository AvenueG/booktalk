<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>booktalk · 会聊天的读书搭子</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #e8e8ed;
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #0071e3;
    --accent-soft: #e8f1fb;
    --hl: #ffe9a8;
    --paper: #fbfaf7;
    --book-text: #2a2925;
    --seg-bg: #e9e9ee;
    --selbar-bg: #1d1d1f;
    --selbar-hover: #3a3a3c;
    --shadow: rgba(0,0,0,.06);
    --serif: Georgia, "Songti SC", "STSong", "Noto Serif SC", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-theme="flash"]) {
      --bg: #1c1c1e;
      --panel: #2c2c2e;
      --border: #3a3a3c;
      --text: #f2f2f7;
      --muted: #98989d;
      --accent: #0a84ff;
      --accent-soft: #1c3a5e;
      --hl: #6b5b1f;
      --paper: #171717;
      --book-text: #d8d3c8;
      --seg-bg: #1c1c1e;
      --selbar-bg: #2c2c2e;
      --selbar-hover: #48484a;
      --shadow: rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e;
    --panel: #2c2c2e;
    --border: #3a3a3c;
    --text: #f2f2f7;
    --muted: #98989d;
    --accent: #0a84ff;
    --accent-soft: #1c3a5e;
    --hl: #6b5b1f;
    --paper: #171717;
    --book-text: #d8d3c8;
    --seg-bg: #1c1c1e;
    --selbar-bg: #2c2c2e;
    --selbar-hover: #48484a;
    --shadow: rgba(0,0,0,.4);
  }
  /* 手电筒模式：仅正文（书）被暗色遮罩 + 光斑聚焦；目录/顶栏/底栏/聊天等 UI 保持日间正常显示，不变暗 */
  /* 笔记编辑器（Vditor）暗夜可读性：它把正文固定成深灰 #24292e，压在深底上读不清；这里对齐页面色 */
  :root[data-theme="dark"] #notes-editor .vditor,
  :root[data-theme="flash"] #notes-editor .vditor {
    --panel-background-color: var(--panel);
    --textarea-background-color: var(--panel);
    --toolbar-background-color: var(--panel);
    --textarea-text-color: var(--text);
    background: var(--panel);
  }
  :root[data-theme="dark"] #notes-editor .vditor-reset,
  :root[data-theme="flash"] #notes-editor .vditor-reset {
    color: var(--text);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
  }
  #app { display: flex; width: 100%; height: 100vh; }

  /* 左：书（Kindle 阅读体验） */
  #sidebar { position: relative; width: 46%; min-width: 360px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--paper); transition: background .25s; }
  #book-header { position: relative; z-index: 3; min-height: 52px; padding: 8px 22px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: center; gap: 12px; }
  #book-title { font-size: 15px; font-weight: 600; white-space: nowrap; }
  #book-hint { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #book-select { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); font-size: 13px; padding: 4px 6px; max-width: 150px; }
  #import-btn { border: 1px solid var(--border); background: var(--panel); color: var(--accent); font-size: 13px; padding: 4px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; flex: none; }
  #import-btn:hover { border-color: var(--accent); }
  #import-btn.importing { color: var(--muted); cursor: default; }
  #book-footer { position: relative; z-index: 3; padding: 8px 22px 10px; border-top: 1px solid var(--border); background: var(--panel); }
  #progress-bar { position: relative; height: 3px; background: var(--border); border-radius: 2px; overflow: visible; cursor: pointer; }
  #progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .3s; }
  #progress-ticks { position: absolute; inset: 0; pointer-events: none; }
  #progress-ticks .bm-tick { position: absolute; top: 50%; width: 3px; height: 9px; transform: translate(-50%, -50%); background: #e8a33d; border-radius: 1px; pointer-events: auto; cursor: pointer; }
  #book-content .seg.bm { box-shadow: inset 3px 0 0 #e8a33d; }
  #toc-bm { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  #toc-bm .toc-bm-title { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  #toc-bm .toc-bm-item { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 0; }
  #toc-bm .toc-bm-item span { flex: 1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toc-bm .toc-bm-item button { border: none; background: transparent; color: var(--muted); cursor: pointer; }
  #progress-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
  #book-content .seg.annot { border-left: 3px solid #4a90d9; padding-left: 8px; }
  #book-content .seg.annot .annot-tag { font-size: 12px; margin-right: 6px; cursor: pointer; opacity: .85; }
  #book-content .seg.annot .annot-tag:hover { opacity: 1; }
  #annot-pop { position: fixed; z-index: 100; display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 24px var(--shadow); padding: 10px; width: 280px; }
  #annot-pop textarea { width: 100%; min-height: 56px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; padding: 6px; resize: vertical; }
  #annot-pop .annot-pop-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  #annot-pop .annot-pop-actions button { border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 12px; padding: 3px 10px; border-radius: 6px; cursor: pointer; }
  #annot-pop .annot-item { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  #annot-pop .annot-item:last-child { border-bottom: none; }
  #annot-pop .annot-item .a-exact { color: var(--muted); font-style: italic; }
  #annot-pop .annot-item .a-del { float: right; border: none; background: transparent; color: var(--muted); cursor: pointer; }
  #flash-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  #flash-controls .fc-label { font-size: 11px; color: var(--muted); }
  #flash-controls input[type=range] { width: 84px; accent-color: var(--accent); }
  #flash-shape { display: flex; gap: 2px; background: var(--seg-bg); border-radius: 7px; padding: 2px; }
  #flash-shape button { border: none; background: transparent; color: var(--text); font-size: 11px; padding: 3px 9px; border-radius: 5px; cursor: pointer; }
  #flash-shape button.active { background: var(--panel); box-shadow: 0 1px 2px var(--shadow); }
  /* 跟着读：主动阅读循环 */
  #guide-row { display: flex; gap: 8px; margin-top: 6px; }
  #guide-row button { flex: 1; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 12px; padding: 5px 0; border-radius: 8px; cursor: pointer; }
  #guide-row button:hover { border-color: var(--accent); color: var(--accent); }
  #guide-panel {
    position: absolute; left: 14px; right: 14px; bottom: 66px; z-index: 5;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 10px 34px var(--shadow);
    padding: 12px 14px; max-height: 62%; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
  }
  #guide-head { display: flex; align-items: center; gap: 8px; }
  #guide-title { font-size: 13px; font-weight: 700; color: var(--accent); flex: 1; }
  #guide-close { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; }
  #guide-close:hover { color: var(--text); }
  #guide-chunk { border-left: 3px solid var(--accent); padding-left: 10px; }
  #guide-chunk-heading { font-size: 13px; font-weight: 600; color: var(--text); }
  #guide-chunk-preview { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 3px; }
  #guide-body { font-size: 14px; line-height: 1.7; color: var(--text); }
  #guide-body .guide-thinking { color: var(--muted); font-size: 13px; }
  #guide-answer-wrap { display: flex; gap: 8px; }
  #guide-answer { flex: 1; min-height: 56px; border: 1px solid var(--border); border-radius: 8px; background: var(--seg-bg); color: var(--text); padding: 8px 10px; font-size: 13px; resize: vertical; font-family: inherit; }
  #guide-answer:focus { outline: none; border-color: var(--accent); }
  #guide-submit { border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: 13px; padding: 0 16px; border-radius: 8px; cursor: pointer; }
  #guide-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #guide-actions button { border: 1px solid var(--border); background: var(--seg-bg); color: var(--text); font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  #guide-actions button:hover { border-color: var(--accent); color: var(--accent); }
  #book-content .guide-cur { background: var(--hl); }
  #book-content .heading.guide-cur { border-radius: 6px; }
  #book-content .seg.guide-cur { border-radius: 4px; }
  #guide-hl-toggle { border: 1px solid var(--border); background: var(--seg-bg); color: var(--muted); font-size: 12px; padding: 3px 10px; border-radius: 20px; cursor: pointer; }
  #guide-hl-toggle.on { color: var(--accent); border-color: var(--accent); }
  .confetti { position: absolute; top: -12px; z-index: 30; pointer-events: none; animation: confetti-fall 2.2s ease-in forwards; }
  @keyframes confetti-fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(90vh) rotate(340deg); opacity: 0; } }
  #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 30; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 20px; padding: 8px 16px; font-size: 13px; box-shadow: 0 6px 20px var(--shadow); display: none; max-width: 80%; text-align: center; }
  #book-content {
    flex: 1; overflow-y: auto; padding: 30px 44px 64px;
    font-family: var(--serif); font-size: 17px; line-height: 1.9; color: var(--book-text);
  }
  #book-content .heading { font-family: var(--serif); font-weight: 700; color: var(--text); }
  #book-content .heading.cov-1::before { content: "●"; color: var(--muted); font-size: 8px; margin-right: 7px; vertical-align: 2px; opacity: .55; }
  #book-content .heading.cov-2::before { content: "●"; color: var(--accent); font-size: 9px; margin-right: 7px; vertical-align: 2px; }
  #book-content .heading.cov-3::before { content: "●"; color: var(--accent); font-size: 11px; margin-right: 6px; vertical-align: 1px; text-shadow: 0 0 6px var(--accent); }
  #book-content h2 { font-size: 22px; margin: 34px 0 14px; }
  #book-content h3 { font-size: 19px; margin: 26px 0 10px; }
  #book-content .seg { margin: 0 0 14px; cursor: text; border-radius: 4px; padding: 2px 4px; margin-left: -4px; transition: background .15s; }
  #book-content .seg.hl { background: var(--hl); }
  #book-content .heading.flash { background: var(--accent-soft); border-radius: 4px; }
  /* 目录侧栏 */
  #toc { position: relative; z-index: 3; display: none; max-height: 42%; overflow: hidden; border-bottom: 1px solid var(--border); background: var(--panel); padding: 8px 14px; }
  #toc-search { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--text); font-size: 13px; flex: none; }
  #toc-search:focus { outline: none; border-color: var(--accent); }
  #toc-list { max-height: calc(42vh - 66px); overflow-y: auto; }
  #toc-empty { font-size: 12px; color: var(--muted); padding: 6px 8px; }
  #toc-toggle { margin-left: auto; flex: none; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
  #toc-toggle:hover { border-color: var(--accent); color: var(--accent); }
  #key-toggle { flex: none; border: 1px solid var(--border); background: var(--panel); color: var(--muted); font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
  #key-toggle:hover { border-color: var(--accent); color: var(--accent); }
  #key-toggle.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .key-sent { color: var(--accent); font-weight: 700; }
  .nonkey { color: var(--muted); opacity: .55; }
  .toc-item { font-size: 13px; color: var(--text); padding: 4px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toc-item:hover { background: var(--seg-bg); }
  .toc-item.active { background: var(--accent-soft); color: var(--accent); }
  .toc-l2 { padding-left: 8px; }
  .toc-l3 { padding-left: 20px; }
  .toc-l4, .toc-l5, .toc-l6 { padding-left: 30px; font-size: 12px; color: var(--muted); }
  /* 手电筒：暗色遮罩 + 跟着指针的径向光斑（成熟范式：CSS 变量存坐标，radial-gradient 在合成层画光） */
  #flashlight {
    position: absolute; inset: 0; z-index: 2; pointer-events: none; display: none;
    background: radial-gradient(
      ellipse calc(var(--fr, 160px)) calc(var(--fr, 160px) / var(--aspect, 1)) at var(--fx, 50%) var(--fy, 50%),
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) var(--core, 66%),
      rgba(0,0,0,.94) 100%);
  }

  /* 右：聊天（Apple 风格） */
  #chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  #chat-header { min-height: 52px; padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; background: var(--panel); }
  #tabs { display: flex; gap: 2px; background: var(--seg-bg); border-radius: 9px; padding: 2px; margin-right: auto; }
  .tab { border: none; background: transparent; color: var(--text); font-size: 13px; padding: 5px 14px; border-radius: 7px; cursor: pointer; }
  .tab.active { background: var(--panel); box-shadow: 0 1px 3px var(--shadow); }
  #chat-header select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--panel); color: var(--text); }
  #podcast, #settings-btn { border: 1px solid var(--border); background: var(--panel); color: var(--muted); font-size: 13px; padding: 5px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  #podcast.on { color: #d9433f; border-color: #d9433f; }
  #theme-switch { display: flex; gap: 2px; background: var(--seg-bg); border-radius: 9px; padding: 2px; }
  #theme-switch button { border: none; background: transparent; color: var(--text); font-size: 14px; cursor: pointer; padding: 5px 8px; border-radius: 7px; line-height: 1; }
  #theme-switch button.active { background: var(--panel); box-shadow: 0 1px 3px var(--shadow); }
  #settings-overlay { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); }
  #settings-panel { width: min(420px, 92vw); max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.3); padding: 18px; }
  #settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #settings-title { font-size: 16px; font-weight: 700; color: var(--text); }
  #settings-close { border: none; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; }
  #settings-panel .settings-sec { margin: 14px 0; }
  #settings-panel .settings-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #settings-panel select, #settings-panel input[type=password] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 13px; }
  #settings-key-status { font-size: 12px; margin-bottom: 6px; }
  #settings-key-status.ok { color: #3fae6a; }
  #settings-key-status.warn { color: #d97706; }
  #settings-panel .settings-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  #settings-panel .settings-actions button { border: 1px solid var(--border); background: var(--accent); color: #fff; font-size: 13px; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  #settings-panel .settings-hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { position: relative; max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.7; font-size: 15px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; white-space: pre-wrap; box-shadow: 0 1px 2px var(--shadow); }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 6px; white-space: pre-wrap; box-shadow: 0 1px 3px var(--shadow); }
  .msg.assistant strong { font-weight: 700; }
  .msg.assistant code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .msg.assistant em { font-style: italic; }
  .cite { color: var(--accent); font-weight: 600; cursor: pointer; }
  .cite:hover { text-decoration: underline; }
  #cite-pop { position: fixed; z-index: 100; max-width: 420px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.16); padding: 12px 14px; font-size: 13.5px; line-height: 1.6; display: none; }
  #cite-pop .cite-head { font-weight: 600; color: var(--accent); margin-bottom: 6px; }
  #cite-pop .cite-text { color: var(--text); white-space: pre-wrap; max-height: 260px; overflow-y: auto; }
  .sources { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 6px; }
  .src { font-size: 12.5px; color: var(--muted); cursor: pointer; padding: 2px 0; }
  .src:hover { color: var(--accent); }
  .msg-tools { margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
  .msg-tools button { border: none; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 0; white-space: nowrap; }
  .msg-tools button:hover { color: var(--accent); }
  .read-aloud.speaking { color: var(--accent); font-weight: 600; }
  .msg-tools .delete-msg:hover { color: #d9433f; }
  .msg.user .user-del { position: absolute; top: 5px; right: 7px; border: none; background: transparent; color: rgba(255,255,255,.62); font-size: 12px; cursor: pointer; padding: 2px 5px; border-radius: 4px; opacity: 0; transition: opacity .15s; }
  .msg.user:hover .user-del { opacity: 1; }
  .msg.user .user-del:hover { color: #fff; background: rgba(0,0,0,.25); }
  .collapse { border: none; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 0 2px 10px; }
  .collapse:hover { color: var(--accent); }
  /* 追问线程：子问答缩进挂在父回答下 */
  .thread { margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .msg.collapsed > .thread { display: none; }
  #reply-chip { flex-basis: 100%; display: none; align-items: center; gap: 8px; font-size: 12.5px; color: var(--accent); }
  #reply-chip .reply-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #reply-cancel { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 4px; }
  #reply-cancel:hover { color: var(--accent); }

  /* 思考动画（三点弹跳 + 分阶段文案） */
  .msg.thinking { display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; }
  .thinking-label { color: var(--muted); font-size: 13.5px; }
  .typing { display: inline-flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 推荐问题 / 开场问题 */
  .suggest { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .suggest-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .suggest-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 13px; padding: 6px 12px; border-radius: 16px; cursor: pointer; text-align: left; }

  /* 欢迎页 */

  #mic.listening { background: #d9433f; color: #fff; border-color: #d9433f; animation: pulse 1.2s infinite; }
  #rec-indicator { display: none; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(255, 149, 0, .45); background: rgba(255, 149, 0, .14); color: #ff9500; font-size: 12px; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }

  #podcast-bar { display: none; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--border); background: var(--panel); font-size: 13px; color: var(--muted); flex-wrap: wrap; }

  #podcast-options select, #podcast-options textarea, #podcast-options button { border: 1px solid var(--border); background: var(--seg-bg); color: var(--text); font-size: 12px; padding: 4px 10px; border-radius: 8px; }

  .podcast-lib-item .pdl-title { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podcast-lib-item .pdl-meta { color: var(--muted); flex: none; }

  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(217, 67, 63, .35); } 50% { box-shadow: 0 0 0 6px rgba(217, 67, 63, 0); } }

  /* 选中浮动条 */

<script src="https://unpkg.com/vditor@4.0.1/dist/index.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const bookContent = $('book-content');
  const messages = $('messages');
  const input = $('input');
  const selbar = $('selbar');

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inlineMd(s) {
    return String(s)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*([^*\s][^*]*)\*/g, '<em>$1</em>');
  }
  function md(s) { return inlineMd(esc(s)); }
  function loadJSON(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v === null || v === undefined ? fallback : v; } catch (e) { return fallback; }
  }
  function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  let currentBook = '';       // 当前书 id（markdown 文件名 stem）
  let noteContent = '';
  let welcomed = false;
  let sessionNodes = [];      // 会话树节点的扁平列表（按插入序）；节点 {id, role, content, parentId, question, sources}
  let msgSeq = 0;
  let pendingParentId = null; // 追问目标（某条 assistant 消息的 id）
  let pendingQuote = '';      // 追问选中的句子
  let askAbort = null;        // 当前正在进行的提问（切书时取消，避免答案串到新书）
  let keyOn = loadJSON('bt-key', false) === true;
  let keyData = null;         // 当前书的中心句 {paragraphs:[{key:[句子下标]}]}
  let guideHl = loadJSON('bt-guide-hl', true) !== false;      // 跟着读：当前段落高亮开关
  let progress = { coverage: {}, lastPos: 0 };   // 阅读进度/高亮按书隔离
  function progressKey() { return 'bt-progress:' + currentBook; }
  function hlKey() { return 'bt-hl:' + currentBook; }
  function loadProgress() {
    progress = loadJSON(progressKey(), { coverage: {}, lastPos: 0 });
    if (!progress.coverage || typeof progress.coverage !== 'object') progress.coverage = {};
    if (typeof progress.lastPos !== 'number') progress.lastPos = 0;
  }

  // ---------- 会话树：追问线程 ----------
  function nodeById(id) {
    for (let i = 0; i < sessionNodes.length; i++) if (sessionNodes[i].id === id) return sessionNodes[i];
    return null;
  }
  function threadHistory(parentId) {
    const chain = [];
    let n = parentId == null ? null : nodeById(parentId);
    while (n) {
      chain.unshift({ role: n.role, content: n.content });
      n = n.parentId == null ? null : nodeById(n.parentId);
    }
    return chain;
  }
  function lastThreadHistory() {
    const last = sessionNodes.length ? sessionNodes[sessionNodes.length - 1] : null;
    return last ? threadHistory(last.id) : [];
  }
  function closestMsg(node) {
    let el = node && node.nodeType === 1 ? node : (node && node.parentElement);
    while (el && el !== document) {
      if (el.classList && el.classList.contains('msg')) return el;
      el = el.parentElement;
    }
    return null;
  }
  function getThread(parentEl) {
    let t = parentEl.querySelector(':scope > .thread');
    if (!t) {
      t = document.createElement('div');
      t.className = 'thread';
      parentEl.appendChild(t);
      ensureCollapseBtn(parentEl);
    }
    return t;
  }
  function ensureCollapseBtn(parentMsg) {
    const tools = parentMsg.querySelector('.msg-tools');
    if (!tools || tools.querySelector('.collapse')) return;
    const b = document.createElement('button');
    b.className = 'collapse';
    b.textContent = '▾ 收起';
    b.addEventListener('click', () => {
      const collapsed = parentMsg.classList.toggle('collapsed');
      b.textContent = collapsed ? '▸ 展开' : '▾ 收起';
    });
    tools.appendChild(b);
  }
  function setReplyMode(parentMsg) {
    const chip = $('reply-chip');
    const snippet = ((parentMsg && parentMsg.dataset.a) || '').replace(/\s+/g, ' ').slice(0, 40);
    $('reply-label').textContent = snippet ? ('追问：「' + snippet + '…」') : '追问这条回答';
    chip.style.display = 'flex';
  }
  function clearReplyMode() {
    pendingParentId = null; pendingQuote = '';
    $('reply-chip').style.display = 'none';
  }

  // ---------- 显示模式：日间 / 暗夜 / 手电筒 ----------
  let currentMode = 'light';
  function isDarkMode() {
    return currentMode === 'dark';
  }
  function setMode(mode) {
    currentMode = mode;
    try { localStorage.setItem('bt-theme', mode); } catch (e) {}
    const flash = mode === 'flash';
    document.documentElement.setAttribute('data-theme', flash ? 'flash' : mode);
    syncVditorTheme(mode);
    $('flashlight').style.display = flash ? 'block' : 'none';
    $('flash-controls').style.display = flash ? '' : 'none';
    document.querySelectorAll('#theme-switch button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    if (flash) { initFlashPos(); startFlashlight(); } else { stopFlashlight(); }
  }
  function initTheme() {
    const saved = localStorage.getItem('bt-theme');
    let mode = saved;
    if (mode !== 'light' && mode !== 'dark' && mode !== 'flash') {
      mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    setMode(mode);
  }
  document.querySelectorAll('#theme-switch button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

  // 手电筒：灯光跟随指针（rAF 平滑拖尾；减少动效偏好则直接贴到指针）
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flashTarget = { x: 0, y: 0 }, flashCur = { x: 0, y: 0 }, flashRAF = null;
  function applyFlashShape() {
    const band = document.querySelector('#flash-shape button.active');
    $('flashlight').style.setProperty('--aspect', (band && band.dataset.shape === 'band') ? '3.2' : '1');
  }
  function applyFlashSoft() {
    $('flashlight').style.setProperty('--core', (100 - $('flash-soft').value * 0.85) + '%');
  }
  function initFlashPos() {
    const fl = $('flashlight');
    fl.style.setProperty('--fr', $('flash-radius').value + 'px');
    applyFlashShape();
    applyFlashSoft();
    const r = fl.getBoundingClientRect();
    flashTarget.x = flashCur.x = r.width / 2;
    flashTarget.y = flashCur.y = r.height * 0.4;
    fl.style.setProperty('--fx', flashCur.x + 'px');
    fl.style.setProperty('--fy', flashCur.y + 'px');
  }
  function stepFlash() {
    const dx = flashTarget.x - flashCur.x, dy = flashTarget.y - flashCur.y;
    if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) {
      flashCur.x = flashTarget.x; flashCur.y = flashTarget.y;
      flashRAF = null;
      return;
    }
    flashCur.x += dx * 0.16; flashCur.y += dy * 0.16;
    const fl = $('flashlight');
    fl.style.setProperty('--fx', flashCur.x + 'px');
    fl.style.setProperty('--fy', flashCur.y + 'px');
    flashRAF = requestAnimationFrame(stepFlash);
  }
  function startFlashlight() {
    if (flashRAF || reducedMotion) return;
    flashRAF = requestAnimationFrame(stepFlash);
  }
  function stopFlashlight() { if (flashRAF) { cancelAnimationFrame(flashRAF); flashRAF = null; } }
  bookContent.addEventListener('mousemove', (e) => {
    if (currentMode !== 'flash') return;
    const r = $('flashlight').getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (reducedMotion) {
      flashCur.x = flashTarget.x = x; flashCur.y = flashTarget.y = y;
      const fl = $('flashlight'); fl.style.setProperty('--fx', x + 'px'); fl.style.setProperty('--fy', y + 'px');
    } else {
      flashTarget.x = x; flashTarget.y = y;
      startFlashlight();
    }
  });
  $('flash-radius').addEventListener('input', () => $('flashlight').style.setProperty('--fr', $('flash-radius').value + 'px'));
  $('flash-soft').addEventListener('input', applyFlashSoft);
  document.querySelectorAll('#flash-shape button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#flash-shape button').forEach(x => x.classList.toggle('active', x === b));
    applyFlashShape();
  }));

  // ---------- 书：列表 / 切换 / 导入 ----------
  async function refreshBooks() {
    try {
      const res = await fetch('/api/books');
      const list = await res.json();
      const sel = $('book-select');
      sel.innerHTML = '';
      list.forEach(b => {
        const o = document.createElement('option');
        o.value = b.name;
        o.textContent = b.name;
        sel.appendChild(o);
      });
      return list.map(b => b.name);
    } catch (e) { return []; }
  }
  async function loadBook(name) {
    const names = await refreshBooks();
    const target = name || $('book-select').value || (names[0] || '');
    if (!target) {
      $('book-title').textContent = '还没有导入书';
      $('book-select').style.display = 'none';
      bookContent.innerHTML = '<p class="seg">点右上角「＋导入」上传一本 PDF / EPUB / MD / TXT。</p>';
      messages.innerHTML = '';
      return;
    }
    $('book-select').style.display = '';
    $('book-select').value = target;
    currentBook = target;
    loadProgress();
    $('book-title').innerHTML = esc(target) + ' <span class="spinner"></span>';
    try {
      const res = await fetch('/api/book/' + encodeURIComponent(target));
      const data = await res.json();
      $('book-title').textContent = data.name || target;
      renderBook(data.markdown || '');
      restorePos();
      if (keyOn) {
        keyData = null;
        try {
          const res2 = await fetch('/api/keypoints?book=' + encodeURIComponent(target));
          keyData = await res2.json();
        } catch (e) { keyData = { paragraphs: [] }; }
        applyKeyHighlights();
      }
      showWelcome();
    } catch (e) {
      $('book-title').textContent = target + '（加载失败）';
    }
  }
  async function switchBook(name) {
    if (!name || name === currentBook) return;
    if (askAbort) askAbort.abort();   // 取消旧书还没答完的问题，避免答案串到新书
    await saveSession();              // 存当前书的会话
    saveProgress();                   // 存当前书的阅读进度
    if (vditor) saveNotes(false);     // 存当前书的笔记
    stopSpeak();
    currentBook = name;
    sessionNodes = []; msgSeq = 0;
    welcomed = false;
    pendingParentId = null; pendingQuote = ''; clearReplyMode();
    noteContent = '';
    messages.innerHTML = '';
    closeGuide();
    if (vditor) { try { vditor.setValue(''); } catch (e) {} }
    await loadBook(name);
    await loadSession();
    if (vditor) loadNotes();
  }
  $('book-select').addEventListener('change', () => switchBook($('book-select').value));
  $('import-btn').addEventListener('click', () => $('import-file').click());
  $('import-file').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const btn = $('import-btn');
    btn.classList.add('importing');
    btn.textContent = '导入中…';
    $('book-title').innerHTML = '正在导入 ' + esc(file.name) + ' … <span class="spinner"></span>';
    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/api/import', { method: 'POST', body: fd });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '导入失败');
      btn.classList.remove('importing');
      btn.textContent = '＋导入';
      if (data.name === currentBook) await loadBook(data.name);   // 重导同一本：只刷新正文/索引
      else await switchBook(data.name);
    } catch (err) {
      btn.classList.remove('importing');
      btn.textContent = '＋导入';
      $('book-title').textContent = '导入失败：' + err;
    }
  });

  function renderBook(md) {
    const lines = md.split('\n');
    let html = '';
    let i = 0, hIdx = 0;
    for (const line of lines) {
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        const lvl = Math.min(h[1].length + 1, 6);
        html += '<h' + lvl + ' class="heading" id="hd-' + (hIdx++) + '">' + esc(h[2].trim()) + '</h' + lvl + '>';
      } else if (line.trim()) {
        html += '<p class="seg" id="seg-' + (i++) + '">' + esc(line.trim()) + '</p>';
      }
    }
    bookContent.innerHTML = html;
    bookContent.querySelectorAll('.seg').forEach(s => { s.dataset.plain = s.textContent; });
    applyHighlights();
    applyBookmarks();
    applyAnnotations();
    applyCoverageMarks();
    updateProgressUI();
  }

  // ---------- 中心句：标出每段最值得读的一句，其余变淡（本地抽取式，不耗 API） ----------
  function splitSentences(text) {
    const parts = text.split(/([。！？；!?;])/);
    const out = [];
    for (let i = 0; i < parts.length - 1; i += 2) out.push(parts[i] + parts[i + 1]);
    if (parts.length % 2 === 1 && parts[parts.length - 1].trim()) out.push(parts[parts.length - 1]);
    return out.filter(s => s.trim());
  }
  function applyKeyHighlights() {
    const paragraphs = (keyData && keyData.paragraphs) || [];
    bookContent.querySelectorAll('.seg').forEach((seg, i) => {
      const key = paragraphs[i] ? paragraphs[i].key : null;
      const plain = seg.dataset.plain || seg.textContent;
      if (keyOn && key && key.length) {
        const keySet = new Set(key);
        seg.innerHTML = splitSentences(plain).map((s, idx) =>
          keySet.has(idx)
            ? '<span class="key-sent">' + esc(s) + '</span>'
            : '<span class="nonkey">' + esc(s) + '</span>'
        ).join('');
      } else {
        seg.innerHTML = esc(plain);
      }
    });
  }
  async function toggleKey() {
    keyOn = !keyOn;
    saveJSON('bt-key', keyOn);
    $('key-toggle').classList.toggle('on', keyOn);
    if (keyOn && !keyData) {
      try {
        const res = await fetch('/api/keypoints?book=' + encodeURIComponent(currentBook));
        keyData = await res.json();
      } catch (e) { keyData = { paragraphs: [] }; }
    }
    applyKeyHighlights();
  }
  $('key-toggle').addEventListener('click', toggleKey);

  // ---------- 目录侧栏 ----------
  function buildTOC() {
    const list = $('toc-list');
    const heads = [...bookContent.querySelectorAll('.heading')];
    list.innerHTML = '';
    if (!heads.length) { list.innerHTML = '<div class="muted">（本书没有检测到标题）</div>'; return; }
    heads.forEach(h => {
      const item = document.createElement('div');
      item.className = 'toc-item toc-l' + h.tagName.replace('H', '');
      item.textContent = h.textContent.trim();
      item.dataset.target = h.id;
      item.dataset.title = h.textContent.trim().toLowerCase();
      item.addEventListener('click', () => {
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        updateTocActive();
      });
      list.appendChild(item);
    });
    filterTOC();
  }
  function filterTOC() {
    const q = $('toc-search').value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll('#toc-list .toc-item').forEach(it => {
      const hit = !q || (it.dataset.title || '').includes(q);
      it.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    let empty = $('toc-empty');
    if (!q || shown > 0) { if (empty) empty.remove(); return; }
    if (!empty) {
      empty = document.createElement('div');
      empty.id = 'toc-empty';
      empty.textContent = '没有匹配的章节';
      $('toc-list').appendChild(empty);
    }
  }
  $('toc-search').addEventListener('input', filterTOC);
  function toggleTOC() {
    const toc = $('toc');
    const show = toc.style.display === 'none';
    toc.style.display = show ? 'block' : 'none';
    if (show) buildTOC();
  }
  let tocRAF = null;
  function updateTocActive() {
    if ($('toc').style.display === 'none') return;
    if (tocRAF) return;
    tocRAF = requestAnimationFrame(() => {
      tocRAF = null;
      const bcTop = bookContent.getBoundingClientRect().top;
      const heads = [...bookContent.querySelectorAll('.heading')];
      let cur = null;
      for (const h of heads) {
        if (h.getBoundingClientRect().top - bcTop <= 48) cur = h;
        else break;
      }
      document.querySelectorAll('#toc .toc-item').forEach(it =>
        it.classList.toggle('active', cur !== null && it.dataset.target === cur.id));
    });
  }
  $('toc-toggle').addEventListener('click', toggleTOC);
  bookContent.addEventListener('scroll', updateTocActive);

  // ---------- 高亮 ----------
  function applyHighlights() {
    const ids = loadJSON(hlKey(), []);
    ids.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hl'); });
  }
  function saveHighlights() {
    const ids = [...document.querySelectorAll('.seg.hl')].map(p => p.id);
    saveJSON(hlKey(), ids);
  }

  // ---------- 书签 ----------
  function bmKey() { return 'bt-bm:' + currentBook; }
  function toggleBookmark(seg) {
    if (!seg || !seg.id) return;
    const bms = loadJSON(bmKey(), []);
    const i = bms.findIndex(b => b.segId === seg.id);
    if (i >= 0) bms.splice(i, 1); else bms.push({ id: 'bm' + Date.now(), segId: seg.id, created: Date.now() });
    saveJSON(bmKey(), bms);
    applyBookmarks();
  }
  function applyBookmarks() {
    const bms = loadJSON(bmKey(), []);
    document.querySelectorAll('#book-content .seg.bm').forEach(s => s.classList.remove('bm'));
    bms.forEach(b => { const el = document.getElementById(b.segId); if (el) el.classList.add('bm'); });
    renderBookmarkTicks();
    renderBookmarkList();
  }
  function renderBookmarkTicks() {
    const wrap = $('progress-ticks');
    if (!wrap) return;
    wrap.innerHTML = '';
    const bms = loadJSON(bmKey(), []);
    const total = bookContent.scrollHeight || 1;
    const box = bookContent.getBoundingClientRect();
    bms.forEach(b => {
      const el = document.getElementById(b.segId);
      if (!el) return;
      const segTop = el.getBoundingClientRect().top - box.top + bookContent.scrollTop;
      const frac = Math.min(1, Math.max(0, segTop / total));
      const t = document.createElement('div');
      t.className = 'bm-tick';
      t.title = (el.textContent || '').slice(0, 40);
      t.style.left = (frac * 100) + '%';
      t.addEventListener('click', (e) => { e.stopPropagation(); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
      wrap.appendChild(t);
    });
  }
  function renderBookmarkList() {
    const wrap = $('toc-bm');
    if (!wrap) return;
    wrap.innerHTML = '';
    const bms = loadJSON(bmKey(), []);
    if (!bms.length) return;
    const title = document.createElement('div');
    title.className = 'toc-bm-title'; title.textContent = '书签';
    wrap.appendChild(title);
    bms.forEach(b => {
      const el = document.getElementById(b.segId);
      if (!el) return;
      const item = document.createElement('div');
      item.className = 'toc-bm-item';
      const span = document.createElement('span');
      span.textContent = (el.textContent || '').slice(0, 30) + '…';
      span.addEventListener('click', () => el.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      const del = document.createElement('button'); del.textContent = '✕'; del.title = '删除书签';
      del.addEventListener('click', () => toggleBookmark(el));
      item.appendChild(span); item.appendChild(del);
      wrap.appendChild(item);
    });
  }

  // ---------- 批注 ----------
  function annotKey() { return 'bt-annot:' + currentBook; }
  function addAnnotation(seg, exact, comment) {
    if (!seg || !seg.id || !(comment || '').trim()) return;
    const annots = loadJSON(annotKey(), []);
    annots.push({ id: 'a' + Date.now(), segId: seg.id, exact: (exact || '').replace(/\s+/g, ' '), comment: comment.trim(), created: Date.now() });
    saveJSON(annotKey(), annots);
    applyAnnotations();
  }
  function deleteAnnotation(id) {
    let annots = loadJSON(annotKey(), []);
    annots = annots.filter(a => a.id !== id);
    saveJSON(annotKey(), annots);
    applyAnnotations();
    hideAnnotPop();
  }
  function applyAnnotations() {
    const annots = loadJSON(annotKey(), []);
    document.querySelectorAll('#book-content .seg.annot').forEach(s => {
      s.classList.remove('annot');
      const t = s.querySelector('.annot-tag'); if (t) t.remove();
    });
    annots.forEach(a => {
      const seg = document.getElementById(a.segId);
      if (!seg) return;
      seg.classList.add('annot');
      let tag = seg.querySelector('.annot-tag');
      if (!tag) {
        tag = document.createElement('span');
        tag.className = 'annot-tag';
        tag.textContent = '💬';
        tag.title = '查看批注';
        tag.addEventListener('click', (e) => { e.stopPropagation(); openAnnotView(seg); });
        seg.insertBefore(tag, seg.firstChild);
      }
    });
  }
  function showAnnotPop(rect) {
    const p = $('annot-pop');
    p.style.display = 'block';
    p.style.top = Math.max(8, (rect.bottom || 0) + 6) + 'px';
    p.style.left = Math.max(8, Math.min((rect.left || 0), window.innerWidth - 296)) + 'px';
  }
  function hideAnnotPop() { const p = $('annot-pop'); if (p) p.style.display = 'none'; }
  function openAnnotInput(seg, exact) {
    const p = $('annot-pop');
    p.innerHTML = '<textarea id="annot-input" placeholder="写点批注…"></textarea>' +
      '<div class="annot-pop-actions"><button id="annot-cancel">取消</button><button id="annot-save">保存</button></div>';
    $('annot-cancel').onclick = hideAnnotPop;
    $('annot-save').onclick = () => { addAnnotation(seg, exact, $('annot-input').value); hideAnnotPop(); };
    showAnnotPop(seg.getBoundingClientRect());
    setTimeout(() => { const t = $('annot-input'); if (t) t.focus(); }, 0);
  }
  function openAnnotView(seg) {
    const annots = loadJSON(annotKey(), []).filter(a => a.segId === seg.id);
    const p = $('annot-pop');
    if (!annots.length) { hideAnnotPop(); return; }
    p.innerHTML = annots.map(a =>
      '<div class="annot-item"><button class="a-del" title="删除">✕</button>' +
      '<div class="a-exact">' + esc(a.exact || '') + '</div>' +
      '<div class="a-comment">' + esc(a.comment) + '</div></div>'
    ).join('') +
      '<div class="annot-pop-actions"><button id="annot-add">＋ 加一条</button></div>';
    p.querySelectorAll('.annot-item').forEach((el, i) => {
      el.querySelector('.a-del').onclick = () => deleteAnnotation(annots[i].id);
    });
    $('annot-add').onclick = () => openAnnotInput(seg, '');
    showAnnotPop(seg.getBoundingClientRect());
  }

  // ---------- 阅读进度（按交互权重，滚动只记「上次读到哪」） ----------
  function saveProgress() { saveJSON(progressKey(), progress); }
  function segHeading(seg) {
    let el = seg.previousElementSibling;
    while (el) {
      if (el.classList && el.classList.contains('heading')) return el.textContent.trim();
      el = el.previousElementSibling;
    }
    return null;
  }
  function bump(heading, lvl) {
    if (!heading) return;
    if (!progress.coverage[heading] || progress.coverage[heading] < lvl) progress.coverage[heading] = lvl;
  }
  function coverageStats() {
    const heads = [...document.querySelectorAll('#book-content .heading')];
    const total = heads.length || 1;
    let m = 0, d = 0, c = 0;
    for (const h of heads) {
      const lvl = progress.coverage[h.textContent.trim()] || 0;
      if (lvl >= 1) m++;
      if (lvl >= 2) d++;
      if (lvl >= 3) c++;
    }
    // 主进度 = 读过几章（翻书/提问都算「读过」），讨论/深读是附加深度
    return { pct: Math.round(m / total * 100), total: heads.length, m, d, c };
  }
  function updateProgressUI() {
    const s = coverageStats();
    $('progress-fill').style.width = s.pct + '%';
    $('progress-label').textContent = '已读 ' + s.m + '/' + s.total + ' 章 · 讨论 ' + s.d + ' · 深读 ' + s.c;
  }
  function restorePos() {
    // 打开书时回到上次读到的地方（书签 lastPos）
    const max = bookContent.scrollHeight - bookContent.clientHeight;
    if (max > 0 && progress.lastPos > 0) bookContent.scrollTop = max * progress.lastPos;
  }
  function applyCoverageMarks() {
    document.querySelectorAll('#book-content .heading').forEach(h => {
      h.classList.remove('cov-1', 'cov-2', 'cov-3');
      const lvl = progress.coverage[h.textContent.trim()] || 0;
      if (lvl >= 1) h.classList.add('cov-' + Math.min(lvl, 3));
    });
  }
  function markCoverage(sources) {
    if (!sources || !sources.length) return;
    sources.forEach((s, i) => {
      const heading = s.heading;
      if (!heading) return;
      const cur = progress.coverage[heading] || 0;
      let lvl = 1;                      // 提及：被引用
      if (i === 0) lvl = 2;             // 讨论：本次问题的核心来源
      if (i === 0 && cur >= 2) lvl = 3; // 覆盖：反复深挖同一章
      if (lvl > cur) progress.coverage[heading] = lvl;
    });
    saveProgress();
    applyCoverageMarks();
    updateProgressUI();
  }
  let scrollTimer = null;
  // 滚到哪个标题，就把它记作「读过」（level 1）：光翻书也算进度，不用非得提问
  function markScrolledHeadings() {
    const top = bookContent.getBoundingClientRect().top + 24;
    const heads = [...bookContent.querySelectorAll('.heading')];
    let last = null;
    for (const h of heads) {
      if (h.getBoundingClientRect().top <= top) last = h; else break;
    }
    if (!last) return;
    const heading = last.textContent.trim();
    if (!progress.coverage[heading]) {
      progress.coverage[heading] = 1;
      updateProgressUI();
      last.classList.add('cov-1');
    }
  }
  bookContent.addEventListener('scroll', () => {
    const max = bookContent.scrollHeight - bookContent.clientHeight;
    if (max <= 0) return;
    progress.lastPos = bookContent.scrollTop / max;   // 书签：上次读到哪
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => { markScrolledHeadings(); saveProgress(); }, 400);
  });
  // 关页/切后台也存一次，别丢进度
  window.addEventListener('beforeunload', saveProgress);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveProgress(); });
  $('progress-bar').addEventListener('click', () => {
    const max = bookContent.scrollHeight - bookContent.clientHeight;
    bookContent.scrollTop = max * (progress.lastPos || 0);
  });

  // ---------- 欢迎页 ----------

        '<div class="welcome-title">你好，我是你的读书搭子 👋</div>' +
        '<div class="welcome-sub">对着《' + title + '》随便问，我回到书里给你讲，还标出处。</div>' +
        '<div class="suggest"><div class="suggest-label">可以这样开始</div><div id="welcome-qs" class="suggest-list"><span class="muted"><span class="spinner"></span> 正在想几个开场问题…</span></div></div>' +
      '</div>';
    fetchSuggestions(true).then(qs => { const c = $('welcome-qs'); if (c) renderChips(c, qs); });

  // ---------- 偏好（人设 / 深度）持久化 ----------
  function restorePrefs() {
    const p = localStorage.getItem('bt-persona');
    if (p) $('persona-select').value = p;
    const d = localStorage.getItem('bt-depth');
    if (d) $('depth-select').value = d;

  $('persona-select').addEventListener('change', () => { try { localStorage.setItem('bt-persona', $('persona-select').value); } catch (e) {} });
  $('depth-select').addEventListener('change', () => { try { localStorage.setItem('bt-depth', $('depth-select').value); } catch (e) {} });
  $('read-voice').addEventListener('change', () => { readVoice = $('read-voice').value; try { localStorage.setItem('bt-read-voice', readVoice); } catch (e) {} });

  // ---------- 思考动画 ----------
  const THINK_STAGES = ['正在检索书里相关内容…', '正在思考…', '正在组织语言…'];
  function addThinking() {
    const div = document.createElement('div');
    div.className = 'msg assistant thinking';
    div.innerHTML = '<span class="thinking-label">正在思考…</span><span class="typing"><i></i><i></i><i></i></span>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    let s = 0;
    div._timer = setInterval(() => {
      s = (s + 1) % THINK_STAGES.length;
      const label = div.querySelector('.thinking-label');
      if (label) label.textContent = THINK_STAGES[s];
    }, 3500);
    return div;
  }
  function removeThinking(div) {
    if (div && div._timer) clearInterval(div._timer);
    if (div) div.remove();
  }

  // ---------- 聊天 ----------
  async function ask(q, parentId, ctx) {
    q = (q || '').trim();
    if (!q) return;
    const book = currentBook;                    // 记住这问属于哪本书，切书后据此作废
    stopSpeak();                                // 每次新提问都打断正在进行的语音/播客
    hideWelcome();
    const pid = parentId == null ? pendingParentId : parentId;   // 追问目标
    const quote = pendingQuote;
    clearReplyMode();
    if (pid != null && quote) {
      q = '关于你说「' + quote.replace(/\s+/g, ' ') + '」这句，' + q;
    }
    const persona = $('persona-select').value || 'default';
    const depth = $('depth-select').value || 'standard';
    const history = pid == null ? lastThreadHistory() : threadHistory(pid);
    // 追问锚定：追问时把「父回答引用的第一处出处」当 context 带过去，避免全局语义检索跑偏到别的话题
    let anchorCtx = ctx ? { text: ctx.text, heading: ctx.heading } : null;
    if (!anchorCtx && pid != null) {
      const pn = sessionNodes.find(n => n.id === pid);
      const srcs = pn && pn.sources;
      if (srcs && srcs.length) anchorCtx = { text: srcs[0].text || '', heading: srcs[0].heading || '' };
    }

    const userNode = { id: msgSeq++, role: 'user', content: q, parentId: pid == null ? null : pid };
    sessionNodes.push(userNode);
    addMsg('user', q, null, null, { id: userNode.id, parentId: userNode.parentId });
    input.value = '';
    resizeInput();

    const btn = $('send'); btn.disabled = true; const old = btn.textContent; btn.textContent = '…';
    const thinkingEl = addThinking();
    if (askAbort) askAbort.abort();             // 同一本书内连续提问，取消上一问
    const ac = new AbortController();
    askAbort = ac;
    let msgEl = null, sources = [], answerText = '', thinkingDone = false;
    try {
      const res = await fetch('/api/ask/stream', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ question: q, persona, depth, history, book, context: anchorCtx ? anchorCtx.text : '', heading: anchorCtx ? anchorCtx.heading : '' }),
        signal: ac.signal
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;
          let ev; try { ev = JSON.parse(line); } catch (e) { continue; }
          if (ev.type === 'sources') {
            sources = ev.sources || [];
            if (!thinkingDone) { removeThinking(thinkingEl); thinkingDone = true; }
            msgEl = addMsg('assistant', '', sources, q, { parentId: userNode.parentId });
          } else if (ev.type === 'delta') {
            answerText += ev.text;
            if (!thinkingDone) { removeThinking(thinkingEl); thinkingDone = true; }
            if (!msgEl) msgEl = addMsg('assistant', '', sources, q, { parentId: userNode.parentId });
            updateMsgAnswer(msgEl, answerText);
          }
        }
      }
      if (!thinkingDone) { removeThinking(thinkingEl); thinkingDone = true; }
      if (currentBook !== book) return;          // 切书了：这条回答作废，不写入任何书
      if (!msgEl) msgEl = addMsg('assistant', answerText || '（没有回答）', sources, q, { parentId: userNode.parentId });
      sessionNodes.push({ id: Number(msgEl.dataset.id), role: 'assistant', content: answerText, parentId: userNode.parentId, question: q, sources });
      if (sessionNodes.length > 200) sessionNodes = sessionNodes.slice(-200);
      markCoverage(sources);
      saveSession();
    } catch (err) {
      if (ac.signal.aborted) return;            // 被切书/连续提问取消，静默退出
      removeThinking(thinkingEl);
      if (msgEl) updateMsgAnswer(msgEl, answerText + '\n\n（请求失败：' + err + '）');
      else addMsg('assistant', '请求失败：' + err, null, null, { parentId: userNode.parentId });
    } finally {
      if (askAbort === ac) askAbort = null;
      btn.disabled = false; btn.textContent = old;
    }
  }
  function send() { ask(input.value); }

  function updateMsgAnswer(msgEl, text) {
    msgEl.dataset.a = text;
    const t = msgEl.querySelector('.msg-text');
    if (t) t.innerHTML = fmtAnswer(text);
    // 只有用户本来就贴近底部时才跟随滚动；往上翻着看时不被新字拽回去
    const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 120;
    if (nearBottom) messages.scrollTop = messages.scrollHeight;
  }

  function addMsg(role, text, sources, question, opts) {
    opts = opts || {};
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.dataset.id = String(opts.id != null ? opts.id : msgSeq++);
    if (role === 'assistant') {
      div.dataset.q = question || '';
      div.dataset.a = text || '';
      div.innerHTML = '<div class="msg-text">' + fmtAnswer(text || '') + '</div>' +
        '<div class="msg-tools"><button class="follow-up">追问</button><button class="suggest-more">💡 追问灵感</button><button class="save-note">存为笔记</button><button class="read-aloud">🔊 朗读</button><button class="delete-msg">删除</button></div>';
    } else {
      div.innerHTML = esc(text) + '<button class="delete-msg user-del" title="删除这条">✕</button>';
    }
    if (sources && sources.length) {
      div.dataset.sources = JSON.stringify(sources);
      div.innerHTML += '<div class="sources">' + sources.map((s, i) =>
        '<div class="src">[' + (i + 1) + '] ' + esc(s.heading || '（无标题）') + '</div>').join('') + '</div>';
    }
    let container = messages;
    if (opts.parentId != null) {
      const parent = document.querySelector('.msg[data-id="' + opts.parentId + '"]');
      if (parent) container = getThread(parent);
    }
    container.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function fmtAnswer(text) {
    let s = esc(text || '');
    s = s.replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
    return inlineMd(s);
  }
  function citeClick(e) {
    const cite = e.target.closest('.cite');
    if (!cite) return;
    const msg = cite.closest('.msg');
    if (!msg) return;
    const n = parseInt(cite.textContent.replace(/[^\d]/g, ''), 10);
    let sources = [];
    try { sources = JSON.parse(msg.dataset.sources || '[]'); } catch (err) {}
    const s = sources[n - 1];
    const pop = $('cite-pop');
    if (!s) {
      pop.innerHTML = '<div class="cite-head">[' + n + ']</div><div class="cite-text muted">这条是刷新前的记录，来源已不保留。</div>';
    } else {
      pop.innerHTML = '<div class="cite-head">[' + n + '] ' + esc(s.heading || '（无标题）') + (s.page ? ' · 第 ' + esc(String(s.page)) + ' 页' : '') + '</div>' +
        '<div class="cite-text">' + esc(s.text || '') + '</div>';
    }
    const r = cite.getBoundingClientRect();
    pop.style.display = 'block';
    let left = Math.min(r.left, window.innerWidth - 420 - 12);
    left = Math.max(12, left);
    pop.style.left = left + 'px';
    if (r.bottom + 300 < window.innerHeight) pop.style.top = (r.bottom + 6) + 'px';
    else pop.style.top = Math.max(12, r.top - 8 - 300) + 'px';
  }
  messages.addEventListener('click', citeClick);
  document.addEventListener('mousedown', (e) => {
    const pop = $('cite-pop');
    if (pop.style.display === 'block' && !e.target.closest('#cite-pop') && !e.target.closest('.cite')) pop.style.display = 'none';
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('cite-pop').style.display = 'none'; });
  messages.addEventListener('scroll', () => { $('cite-pop').style.display = 'none'; });

  // ---------- 推荐问题 ----------
  async function fetchSuggestions(seed, question, answer) {
    try {
      const persona = $('persona-select').value || 'default';
      const res = await fetch('/api/suggest', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ seed, question: question || '', answer: answer || '', persona, book: currentBook })
      });
      const data = await res.json();
      return data.questions || [];
    } catch (e) { return []; }
  }
  function renderChips(container, questions, parentId) {
    container.innerHTML = '';
    if (!questions || !questions.length) {
      container.innerHTML = '<span class="muted">（暂时没有推荐）</span>';
      return;
    }
    questions.forEach(q => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = q;
      b.addEventListener('click', () => ask(q, parentId));
      container.appendChild(b);
    });

  function attachSuggestions(msgEl, questions) {
    if (!msgEl || !questions || !questions.length) return;
    const box = document.createElement('div');
    box.className = 'suggest';
    box.innerHTML = '<div class="suggest-label">你可能还想问</div>';
    const list = document.createElement('div');
    list.className = 'suggest-list';
    renderChips(list, questions, Number(msgEl.dataset.id));
    box.appendChild(list);
    msgEl.appendChild(box);
    messages.scrollTop = messages.scrollHeight;
  }

  function deleteMsg(msg) {
    if (!msg) return;
    const ids = new Set();
    ids.add(Number(msg.dataset.id));
    msg.querySelectorAll('.msg').forEach(m => ids.add(Number(m.dataset.id)));
    sessionNodes = sessionNodes.filter(n => !ids.has(n.id));
    msg.remove();
    saveSession();
  }

  messages.addEventListener('click', (e) => {
    const del = e.target.closest('.delete-msg');
    if (del) { deleteMsg(del.closest('.msg')); return; }
    const src = e.target.closest('.src');
    if (src) {
      const heading = src.textContent.replace(/^\[\d+\]\s*/, '');
      const heads = [...document.querySelectorAll('#book-content .heading')];
      const el = heads.find(h => h.textContent.trim() === heading);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 1600);
      }
      return;
    }
    const read = e.target.closest('.read-aloud');
    if (read) {
      const msg = read.closest('.msg.assistant');
      const a = (msg && msg.dataset.a) || '';
      if (speaking && speakingEl === read) stopSpeak();
      else speak(a, read);
      return;
    }
    const fu = e.target.closest('.follow-up');
    if (fu) {
      const msg = fu.closest('.msg.assistant');
      if (msg) { pendingParentId = Number(msg.dataset.id); pendingQuote = ''; setReplyMode(msg); input.focus(); }
      return;
    }
    const sm = e.target.closest('.suggest-more');
    if (sm) {
      const msg = sm.closest('.msg.assistant');
      if (msg && !msg.querySelector('.suggest')) {
        const q = (msg && msg.dataset.q) || '';
        const a = (msg && msg.dataset.a) || '';
        sm.textContent = '…';
        fetchSuggestions(false, q, a).then(qs => { sm.remove(); attachSuggestions(msg, qs); });
      }
      return;
    }
    const save = e.target.closest('.save-note');
    if (save) {
      const msg = save.closest('.msg.assistant');
      const q = (msg && msg.dataset.q) || '';
      const a = (msg && msg.dataset.a) || '';
      // 溯源：带上这条回答对应的章节 + 原文片段，日后整理/回看才知道「当时为什么这么想」
      let node = null;
      for (const n of sessionNodes) if (n.id === Number(msg && msg.dataset.id)) { node = n; break; }
      const src = node && node.sources && node.sources[0];
      const heading = (src && src.heading) || '';
      const quote = (src && src.text) || '';
      let block = '### 问：' + q + '\n\n' + a;
      if (heading && heading !== '（无标题）') {
        block += '\n\n> 📖 ' + heading + (quote ? '：「' + quote.replace(/\s+/g, ' ').slice(0, 120) + '」' : '');
      }
      appendToNote(block);
    }
  });

  function findSeg(node) {

  // ---------- 会话持久化（刷新不丢聊天） ----------
  async function loadSession() {
    try {
      const res = await fetch('/api/session?book=' + encodeURIComponent(currentBook));
      const data = await res.json();
      const msgs = (data.messages || []).slice(-200);
      if (!msgs.length) return;
      sessionNodes = []; msgSeq = 0; welcomed = true;
      messages.innerHTML = '';
      msgs.forEach(m => {
        const hasId = m.id != null;
        const id = hasId ? Number(m.id) : msgSeq++;
        if (hasId) msgSeq = Math.max(msgSeq, id + 1);
        const node = {
          id,
          role: m.role,
          content: m.content || '',
          parentId: m.parentId == null ? null : Number(m.parentId),
          question: m.question || '',
          sources: m.sources || null
        };
        sessionNodes.push(node);
        addMsg(node.role, node.content, node.sources, node.question, { id: node.id, parentId: node.parentId });
      });
      messages.scrollTop = messages.scrollHeight;
    } catch (e) {}
  }
  async function saveSession() {
    try {
      await fetch('/api/session?book=' + encodeURIComponent(currentBook), {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ messages: sessionNodes })
      });
    } catch (e) {}
  }

  // ---------- 语音 & 播客：AI 讲（edge-tts 神经语音），你随时插嘴（STT 打断） ----------
  let speaking = false, speakingEl = null;
  let audioSeq = 0;
  let curAudio = null;
  // 朗读音色：默认男声「云健」，跟播客两位主播（小晓女声/小宇男声）区分开
  let readVoice = 'zh-CN-YunjianNeural';

  function speechText(s) {
    return String(s || '')
      .replace(/\[(\d+)\]/g, '')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\*([^*\s][^*]*)\*/g, '$1')
      .replace(/^\s{0,3}(?:[#>*+-]|\d+[.)])\s+/gm, '')
      .replace(/\n{2,}/g, '\n')
      .replace(/[ \t]{2,}/g, ' ');
  }
  function updateReadBtns() {
    document.querySelectorAll('.read-aloud').forEach(b => {
      b.textContent = (speaking && b === speakingEl) ? '⏹ 停' : '🔊 朗读';
      b.classList.toggle('speaking', speaking && b === speakingEl);
    });
  }
  function cancelSpeech() {
    audioSeq++;
    if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio.src = ''; curAudio = null; }
    speaking = false; speakingEl = null; updateReadBtns();
  }
  function stopSpeak() {
    cancelSpeech();
  }
  async function speak(text, btn, onDone) {
    const clean = speechText(text);
    cancelSpeech();
    const mySeq = audioSeq;
    if (!clean.trim()) { if (onDone) onDone(); return; }
    speaking = true; speakingEl = btn || null; updateReadBtns();
    try {
      const res = await fetch('/api/tts', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text: clean, voice: readVoice })
      });
      if (!res.ok) throw new Error('tts ' + res.status);
      const blob = await res.blob();
      if (mySeq !== audioSeq) return;      // 已被打断，丢弃
      const url = URL.createObjectURL(blob);
      const a = new Audio(url);
      curAudio = a;
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        URL.revokeObjectURL(url);
        if (mySeq !== audioSeq) return;
        speaking = false; speakingEl = null; updateReadBtns();
        if (onDone) onDone();
      };
      a.onended = finish;
      a.onerror = finish;
      a.play().catch(() => finish());      // 被自动播放策略拦了就结束这条，继续循环
    } catch (e) {
      if (mySeq !== audioSeq) return;
      speaking = false; speakingEl = null; updateReadBtns();
      console.warn('TTS 失败', e);
      if (onDone) onDone();                // 网络/接口失败：不卡住循环
    }
  }
  // ---------- 双人播客：读全书(免费) → 一次生成双人脚本 → 双音色合成 ----------
  let podcastBusy = false;
  let podcastScript = '';   // 当前正在播的脚本全文，插嘴时用来告诉主播「刚才播到哪」
  function setPodcastStatus(msg) { $('podcast-status').textContent = msg; }
  let podcastChaptersBook = '';
  function loadPodcastChapters() {
    if (podcastChaptersBook === currentBook) { updatePodcastChCount(); return; }
    const list = $('podcast-ch-list');
    list.innerHTML = '';
    fetch('/api/book/' + encodeURIComponent(currentBook) + '/headings')
      .then(r => r.json())
      .then(d => {
        (d.headings || []).forEach(h => {
          const lab = document.createElement('label');
          const cb = document.createElement('input');
          cb.type = 'checkbox'; cb.value = h;
          lab.appendChild(cb);
          lab.appendChild(document.createTextNode(' ' + h));
          list.appendChild(lab);
        });
        podcastChaptersBook = currentBook;
        updatePodcastChCount();
      })
      .catch(() => { podcastChaptersBook = ''; });
  }
  function podcastChapters() {
    return Array.from($('podcast-ch-list').querySelectorAll('input:checked')).map(c => c.value);
  }
  function updatePodcastChCount() {
    const boxes = $('podcast-ch-list').querySelectorAll('input');
    if (!boxes.length) { $('podcast-ch-count').textContent = '全部章节'; return; }
    const checked = podcastChapters().length;
    $('podcast-ch-count').textContent = checked ? ('已选 ' + checked + '/' + boxes.length + ' 章') : '全部章节';
  }
  function loadPodcastLibrary() {
    fetch('/api/podcasts?book=' + encodeURIComponent(currentBook))
      .then(r => r.json())
      .then(d => {
        const list = $('podcast-lib-list');
        list.innerHTML = '';
        const items = d.items || [];
        if (!items.length) { list.innerHTML = '<div class="pdl-empty">还没有保存的播客</div>'; return; }
        items.forEach(it => {
          const url = '/api/podcast/' + it.id + '.mp3';
          const row = document.createElement('div');
          row.className = 'podcast-lib-item';
          const title = document.createElement('span');

  function openPodcastBar() {

  async function makePodcast() {

  function podcastInterrupt() {
    const main = $('podcast-audio');

    if (!SR) { toast('语音插嘴需要 Chrome / Edge'); return; }
    main.pause();
    disarmPodcastListen();   // 手动插嘴时停掉自动监听，避免两个麦克风同时开
    stopSpeak();
    setPodcastStatus('你说，我听着…');
    const r = new SR();
    r.lang = 'zh-CN'; r.interimResults = false; r.continuous = false; r.maxAlternatives = 1;
    let got = false;
    r.onresult = (e) => {
      let txt = '';
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      txt = txt.trim();
      if (txt) { got = true; podcastAnswer(txt, main); }
    };
    r.onend = () => { manualPodcastListening = false; refreshRecIndicator(); if (!got) { setPodcastStatus('没听清，继续播'); main.play().catch(() => {}); } };
    r.onerror = () => { manualPodcastListening = false; refreshRecIndicator(); if (!got) { setPodcastStatus('没听清，继续播'); main.play().catch(() => {}); } };
    try { r.start(); manualPodcastListening = true; refreshRecIndicator(); } catch (e) { setPodcastStatus('麦克风不可用'); main.play().catch(() => {}); return; }
    setTimeout(() => { try { r.stop(); } catch (e) {} }, 12000);
  }
  function _podcastTurns(script) {
    const turns = [];
    let v = '小晓：', cur = [];
    for (const raw of (script || '').split('\n')) {
      const line = raw.trim();
      if (!line) continue;
      const a = line.match(/^(?:小晓|晓晓|小A|A|主播A)[：:]\s*(.*)$/);
      if (a) { if (cur.length) turns.push([v, cur.join('')]); cur = []; v = '小晓：'; cur.push(a[1]); continue; }
      const b = line.match(/^(?:小宇|宇宇|小B|B|主播B)[：:]\s*(.*)$/);
      if (b) { if (cur.length) turns.push([v, cur.join('')]); cur = []; v = '小宇：'; cur.push(b[1]); continue; }
      cur.push(line);
    }
    if (cur.length) turns.push([v, cur.join('')]);
    const out = [];
    for (const [vv, t] of turns) {
      const tt = t.trim();
      if (!tt) continue;
      if (out.length && out[out.length - 1][0] === vv) out[out.length - 1][1] += tt;
      else out.push([vv, tt]);
    }
    return out;
  }
  function resumePodcast(main, at) {
    if (!main.src) { setPodcastStatus('就绪'); return; }
    try { main.currentTime = Math.max(0, at); } catch (e) {}
    main.volume = 0;
    setPodcastStatus('就绪 · 继续播');
    const p = main.play();
    if (p && p.then) p.catch(() => { main.volume = 1; });
    const t0 = performance.now();
    const ramp = () => {
      const k = Math.min(1, (performance.now() - t0) / 1500);
      main.volume = k;
      if (k < 1) requestAnimationFrame(ramp);
    };
    requestAnimationFrame(ramp);
  }
  function podcastContextAt(main) {
    if (!podcastScript) return '';
    const dur = main.duration || 0;
    const t = main.currentTime || 0;
    const frac = dur > 0 ? Math.min(1, Math.max(0, t / dur)) : 0;
    const pos = Math.floor(frac * podcastScript.length);
    return podcastScript.slice(Math.max(0, pos - 180), pos).replace(/\s+/g, ' ').trim();
  }
  // 按句续播：把脚本按句切分，用字符比例近似每句在音频里的位置（同一音色语速大致恒定）。
  // 返回每句「开始位置比例」(0..1) 的升序数组。
  function podcastSentenceStarts(script) {
    const flat = (script || '')
      .split('\n')
      .map(l => l.replace(/^(?:小晓|晓晓|小A|A|主播A|小宇|宇宇|小B|B|主播B)[：:]\s*/, '').trim())
      .filter(Boolean)
      .join('');
    if (!flat) return [];
    const sents = flat.match(/[^。！？；!?;]+[。！？；!?;]?/g) || [flat];
    const total = flat.length || 1;
    const starts = [];
    let acc = 0;
    for (const s of sents) { starts.push(acc / total); acc += s.length; }
    return starts;
  }
  // 当前播放位置所在的句子的「句首时间」，用来续播（而不是硬回退 8 秒）。
  function sentenceResumeTime(main) {
    const dur = main.duration || 0;
    const t = main.currentTime || 0;
    if (!dur || !podcastScript) return Math.max(0, t - 8);
    const frac = Math.min(1, Math.max(0, t / dur));
    const starts = podcastSentenceStarts(podcastScript);
    if (!starts.length) return 0;
    let cur = 0;
    for (const s of starts) { if (s <= frac + 1e-9) cur = s; else break; }
    return cur * dur;
  }
  async function podcastAnswer(q, main) {
    setPodcastStatus('主播在想…');
    // 按句续播：回到「正在播的那一句」的句首，而不是硬回退 8 秒
    const resumeAt = sentenceResumeTime(main);
    const context = podcastContextAt(main);
    try {
      const r = await fetch('/api/podcast/answer/stream?book=' + encodeURIComponent(currentBook), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, context })
      });
      if (!r.ok || !r.body) throw new Error('接口失败 ' + r.status);
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let playChain = Promise.resolve();   // 按顺序播放各轮
      let firstAudioStarted = false;
      let errorMsg = '';
      function enqueueTurn(voice, text) {
        // 每轮边生成边合成（并行），但按顺序播放：第一句好了就立刻出声
        const tts = fetch('/api/podcast/audio', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script: voice + text })
        }).then(async res => {
          if (!res.ok) throw new Error('合成失败 ' + res.status);
          return URL.createObjectURL(await res.blob());
        });
        playChain = playChain.then(() => tts).then(async url => {
          await new Promise((resolve) => {
            const a = new Audio(url);
            a.onended = () => { URL.revokeObjectURL(url); resolve(); };
            a.onerror = () => { URL.revokeObjectURL(url); resolve(); };
            a.play().catch(() => { URL.revokeObjectURL(url); resolve(); });
          });
        }).catch(() => {});
      }
      function handleLine(line) {
        line = line.trim();
        if (!line) return;
        let ev;
        try { ev = JSON.parse(line); } catch (e) { return; }
        if (ev.type === 'turn' && ev.t) {
          if (!firstAudioStarted) { firstAudioStarted = true; setPodcastStatus('主播回答…'); }
          enqueueTurn(ev.v || '小晓：', ev.t);
        } else if (ev.type === 'error') {
          errorMsg = ev.error || '没答上';
        }
      }
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          handleLine(buf.slice(0, nl));
          buf = buf.slice(nl + 1);
        }
      }
      if (buf) handleLine(buf);   // 万一最后一行没换行
      await playChain;
      if (errorMsg && !firstAudioStarted) throw new Error(errorMsg);
      resumePodcast(main, resumeAt);
    } catch (e) {
      setPodcastStatus('失败：' + e.message);
      resumePodcast(main, resumeAt);
    }
  }

  // ---------- 全程插嘴（自动监听）：播客播放时保持「听」循环，一开口就暂停并回答 ----------
  let podcastAutoOn = false;      // 用户是否开了「自动插嘴」
  let podcastListening = false;   // 当前是否有一个听写循环在跑
  let podRec = null;
  let micOn = false;              // 聊天 🎤 是否在听
  let manualPodcastListening = false;  // 手动插嘴的临时监听
  function refreshRecIndicator() {
    // 汇总所有麦克风状态：只要有一个在录音，右上角就亮「录音中」（对标 macOS 菜单栏橙色录音灯）

  function armPodcastListen() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    const main = $('podcast-audio');
    const r = new SR();

    podcastListening = true;

    r.lang = 'zh-CN'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;

    r.onresult = (e) => {
      let final = '', interim = '';

      }
      const t = (final || interim).trim();

      }

    r.onend = () => {
      podcastListening = false; podRec = null;
      refreshRecIndicator();

        podcastAnswer(text, main);               // 回答完 resumePodcast 会重新武装
      } else if (podcastAutoOn && podcastPlaying()) {

      }
    };
    r.onerror = (e) => {
      const code = e && e.error;
      if (code === 'not-allowed' || code === 'service-not-allowed') {

      } else if (code !== 'no-speech' && code !== 'aborted') {

      }
      // no-speech / aborted 不在这里重新武装：onend 一定会紧随其后触发，交给它统一处理，避免重复监听
    };

  }
  function setPodcastAuto(on) {

  // 听写（STT）：点麦克风 = 随时插嘴 —— 立刻打断 AI 讲话，说完自动发送
  let rec = null;
  let sttWatchdog = null;
  let lastInterim = '';
  const MIC_HINT = '问这本书任何问题，回车发送（Shift+回车换行）';
  function sttErrText(code) {
    const map = {
      'no-speech': '没听到声音',
      'not-allowed': '麦克风权限被拒',
      'audio-capture': '找不到麦克风',
      'network': '语音识别服务连不上（需联网）',

      'language-not-supported': '不支持这个语言',

        }

        clearWatchdog();

          setMic(false);

      };

  function setMic(on) {

  // ---------- 笔记（Vditor 所见即所得，底层存 Markdown） ----------
  let vditor = null;

  async function saveNotes(showStatus) {

  async function appendToNote(mdtext) {
