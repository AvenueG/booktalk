<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>booktalk · 会聊天的读书搭子</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #e8e8ed;
    --divider: rgba(0,0,0,.06);
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #0071e3;
    --accent-soft: #e8f1fb;
    --hl: #ffe9a8;
    --paper: #fbfaf7;
    --book-text: #2a2925;
    --seg-bg: #e9e9ee;
    --selbar-bg: #1d1d1f;
    --selbar-hover: #3a3a3c;
    --shadow: rgba(0,0,0,.06);
    --serif: Georgia, "Songti SC", "STSong", "Noto Serif SC", "Times New Roman", serif;
    /* 苹果式缓动：交互用平滑 ease-out，弹层/按压用带轻微回弹的 spring */
    --ease-out: cubic-bezier(.33, 1, .68, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-theme="flash"]) {
      --bg: #1c1c1e;
      --panel: #2c2c2e;
      --border: #3a3a3c;
      --divider: #3a3a3c;
      --text: #f2f2f7;
      --muted: #98989d;
      --accent: #0a84ff;
      --accent-soft: #1c3a5e;
      --hl: #6b5b1f;
      --paper: #171717;
      --book-text: #d8d3c8;
      --seg-bg: #1c1c1e;
      --selbar-bg: #2c2c2e;
      --selbar-hover: #48484a;
      --shadow: rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e;
    --panel: #2c2c2e;
    --border: #3a3a3c;
    --divider: #3a3a3c;
    --text: #f2f2f7;
    --muted: #98989d;
    --accent: #0a84ff;
    --accent-soft: #1c3a5e;
    --hl: #6b5b1f;
    --paper: #171717;
    --book-text: #d8d3c8;
    --seg-bg: #1c1c1e;
    --selbar-bg: #2c2c2e;
    --selbar-hover: #48484a;
    --shadow: rgba(0,0,0,.4);
  }
  /* 手电筒模式：仅正文（书）被暗色遮罩 + 光斑聚焦；目录/顶栏/底栏/聊天等 UI 保持日间正常显示，不变暗 */
  /* 笔记编辑器（Vditor）暗夜可读性：它把正文固定成深灰 #24292e，压在深底上读不清；这里对齐页面色 */
  :root[data-theme="dark"] #notes-editor .vditor,
  :root[data-theme="flash"] #notes-editor .vditor {
    --panel-background-color: var(--panel);
    --textarea-background-color: var(--panel);
    --toolbar-background-color: var(--panel);
    --textarea-text-color: var(--text);
    background: var(--panel);
  }
  :root[data-theme="dark"] #notes-editor .vditor-reset,
  :root[data-theme="flash"] #notes-editor .vditor-reset {
    color: var(--text);
  }
  * { box-sizing: border-box; }
  /* 苹果式过渡：交互统一平滑缓动 + 轻微按压回弹，弹层淡入/缩放出现 */
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes rise-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  button { -webkit-tap-highlight-color: transparent; transition: transform .15s var(--ease-out), opacity .2s var(--ease-out), background-color .2s var(--ease-out), border-color .2s var(--ease-out), color .2s var(--ease-out), box-shadow .25s var(--ease-out); }
  button:active { transform: scale(.97); }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  }
  /* 统一图标：Lucide 风格内联 SVG，currentColor 随主题变色 */
  .ic { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; flex: none; }
  .ic-sm { width: 14px; height: 14px; vertical-align: -2px; }
  .ic-only { display: inline-flex; align-items: center; justify-content: center; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
  }
  #app { display: flex; width: 100%; height: 100vh; }

  /* 左侧折叠菜单：书籍 + 批注/书签便签概览（像从本子边缘漏出来的便签纸） */
  #rail { position: relative; z-index: 5; width: 264px; flex: none; background: var(--panel); border-right: 1px solid var(--divider); display: flex; flex-direction: column; overflow: hidden; }
  #rail.collapsed { width: 48px; }
  #rail-toggle { height: 40px; display: flex; align-items: center; justify-content: flex-end; padding-right: 14px; font-size: 17px; color: var(--muted); cursor: pointer; user-select: none; flex: none; }
  #rail-toggle:hover { color: var(--accent); }
  #rail.collapsed #rail-toggle { justify-content: center; padding-right: 0; }
  #rail-body { flex: 1; overflow-y: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 16px; min-width: 264px; box-sizing: border-box; }
  #rail.collapsed #rail-body { display: none; }
  .rail-sec { display: flex; flex-direction: column; gap: 6px; }
  .rail-sec:last-child { flex: 1; min-height: 0; }
  .rail-sec-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  #rail-import { border: 1px solid var(--border); background: var(--accent); color: #fff; font-size: 13px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  #rail-import:hover { opacity: .9; }
  #rail-import.importing { opacity: .6; cursor: default; }
  #rail-books { display: flex; flex-direction: column; gap: 2px; }
  #rail-books .rail-book { display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--text); transition: background-color .15s var(--ease-out), color .15s var(--ease-out); }
  #rail-books .rail-book:hover { background: var(--seg-bg); }
  #rail-books .rail-book.active { background: var(--accent-soft); color: var(--accent); }
  #rail-books .rail-book-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rail-books .rail-book-del { display: none; border: none; background: transparent; color: var(--muted); cursor: pointer; padding: 2px; border-radius: 4px; line-height: 0; flex: none; }
  #rail-books .rail-book:hover .rail-book-del { display: inline-flex; align-items: center; justify-content: center; }
  #rail-books .rail-book-del:hover { color: #d9433f; background: var(--seg-bg); }
  #rail-overview { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .rl-inner { position: relative; padding: 4px 2px 10px 26px; }
  .rl-inner::before { content: ''; position: absolute; left: 9px; top: 10px; bottom: 16px; width: 2px; background: var(--border); border-radius: 1px; pointer-events: none; }
  .rl-ch { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--muted); padding: 12px 2px 4px 0; cursor: pointer; transform: scale(var(--dock, 1)); transform-origin: left center; transition: transform .15s var(--ease-out), color .15s var(--ease-out); }
  .rl-ch:hover { color: var(--accent); }
  .rl-ch-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rl-ch.hd-1 { font-size: 12px; color: var(--text); }
  .rl-ch.active { color: var(--accent); }
  .rl-ch.active::after { content: ''; flex: none; width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid #eab308; }
  .rl-row { position: relative; margin: 0 0 8px; cursor: pointer; }
  .rl-dot { position: absolute; left: 9px; top: 15px; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; background: #4a90d9; z-index: 2; }
  .rl-dot.bm { border-radius: 2px; background: #e8a33d; }
  .rl-conn { position: absolute; left: 9px; top: 15px; width: 17px; height: 2px; background: var(--border); }
  .rail-empty { font-size: 12px; color: var(--muted); padding: 6px 4px 6px 26px; }
  /* 批注/书签直显卡片 */
  .rail-card { position: relative; border: 1px solid var(--border); border-radius: 9px; padding: 8px 26px 8px 12px; cursor: pointer; background: var(--bg); text-align: left; transform: scale(var(--dock, 1)); transform-origin: left center; transition: transform .15s var(--ease-out), border-color .2s var(--ease-out); }
  .rail-card:hover { border-color: var(--accent); }
  .rail-card .rc-head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .rail-card .rc-kind { font-weight: 700; }
  .rail-card.annot .rc-kind { color: #4a90d9; }
  .rail-card.bm .rc-kind { color: #e8a33d; }
  .rail-card .rc-text { font-size: 12.5px; color: var(--text); margin-top: 4px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .rail-card .rc-del { position: absolute; top: 6px; right: 6px; border: none; background: transparent; color: var(--muted); cursor: pointer; padding: 3px; border-radius: 5px; display: none; line-height: 0; }
  .rail-card:hover .rc-del { display: block; }
  .rail-card .rc-del:hover { color: #d9433f; background: var(--seg-bg); }
  /* 折叠态：一列快捷小图标（导入 / 时间轴 / 播客库 / 设置） */
  #rail-mini { display: none; flex: 1; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; overflow-y: auto; }
  #rail.collapsed #rail-mini { display: flex; }
  .rail-mini-btn { width: 34px; height: 34px; border: none; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .rail-mini-btn:hover { background: var(--seg-bg); color: var(--accent); }
  .rail-mini-btn .ic { width: 18px; height: 18px; }

  /* 左：书（Kindle 阅读体验） */
  #sidebar { position: relative; width: 46%; min-width: 360px; border-right: 1px solid var(--divider); display: flex; flex-direction: column; background: var(--paper); transition: background .25s; }
  #book-header { position: relative; z-index: 3; min-height: 52px; padding: 8px 22px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: center; gap: 12px; }
  #book-title { font-size: 15px; font-weight: 600; white-space: nowrap; }
  #book-footer { position: relative; z-index: 3; padding: 12px 22px 12px; border-top: 1px solid var(--border); background: var(--panel); }
  #progress-bar { position: relative; height: 3px; background: var(--border); border-radius: 2px; overflow: visible; cursor: pointer; }
  #progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .3s; }
  #progress-ticks { position: absolute; inset: 0; pointer-events: none; }
  #progress-ticks .bm-tick { position: absolute; top: 50%; width: 3px; height: 9px; transform: translate(-50%, -50%) scale(var(--dock, 1)); transform-origin: center bottom; background: #e8a33d; border-radius: 1px; pointer-events: auto; cursor: pointer; transition: transform .15s; }
  #book-content .seg.bm { box-shadow: inset 3px 0 0 #e8a33d; }
  #progress-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
  #book-content .seg.annot { border-left: 3px solid #4a90d9; padding-left: 8px; }
  #book-content .seg.annot .annot-tag { font-size: 12px; margin-right: 6px; cursor: pointer; opacity: .85; }
  #book-content .seg.annot .annot-tag:hover { opacity: 1; }
  #annot-pop { position: fixed; z-index: 100; display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 24px var(--shadow); padding: 10px; width: 280px; }
  #annot-pop textarea { width: 100%; min-height: 56px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; padding: 6px; resize: vertical; }
  #annot-pop .annot-pop-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  #annot-pop .annot-pop-actions button { border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 12px; padding: 3px 10px; border-radius: 6px; cursor: pointer; }
  #annot-pop .annot-item { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  #annot-pop .annot-item:last-child { border-bottom: none; }
  #annot-pop .annot-item .a-exact { color: var(--muted); font-style: italic; }
  #annot-pop .annot-item .a-del { float: right; border: none; background: transparent; color: var(--muted); cursor: pointer; }
  #flash-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  #flash-controls .fc-label { font-size: 11px; color: var(--muted); }
  #flash-controls .fc-hint { font-size: 11px; color: var(--muted); margin-right: auto; }
  #flash-shape { display: flex; gap: 2px; background: var(--seg-bg); border-radius: 7px; padding: 2px; }
  #flash-shape button { border: none; background: transparent; color: var(--text); font-size: 11px; padding: 3px 9px; border-radius: 5px; cursor: pointer; }
  #flash-shape button.active { background: var(--panel); box-shadow: 0 1px 2px var(--shadow); }
  /* 跟着读：主动阅读循环 */
  #guide-row { display: flex; gap: 8px; margin-top: 8px; }
  #guide-row button { flex: 1; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 13px; padding: 0 14px; min-height: 40px; border-radius: 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  #guide-row button:hover { border-color: var(--accent); color: var(--accent); }
  #guide-panel {
    position: absolute; left: 14px; right: 14px; bottom: 66px; z-index: 5;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 10px 34px var(--shadow);
    padding: 12px 14px; max-height: 62%; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    animation: rise-in .22s var(--ease-out);
  }
  #guide-head { display: flex; align-items: center; gap: 8px; }
  #guide-title { font-size: 13px; font-weight: 700; color: var(--accent); flex: 1; }
  #guide-close { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; }
  #guide-close:hover { color: var(--text); }
  #guide-chunk { border-left: 3px solid var(--accent); padding-left: 10px; }
  #guide-chunk-heading { font-size: 13px; font-weight: 600; color: var(--text); }
  #guide-chunk-preview { font-size: 14px; color: var(--text); line-height: 1.7; margin-top: 4px; }
  #guide-chunk-preview .guide-thinking { color: var(--muted); font-size: 13px; }
  #guide-src-toggle { margin-top: 6px; border: 1px solid var(--border); background: var(--seg-bg); color: var(--muted); font-size: 12px; padding: 2px 10px; border-radius: 20px; cursor: pointer; }
  #guide-src-toggle:hover { color: var(--accent); border-color: var(--accent); }
  #guide-chunk-src { margin-top: 6px; font-size: 12.5px; color: var(--muted); line-height: 1.6; max-height: 160px; overflow-y: auto; border-top: 1px dashed var(--border); padding-top: 6px; white-space: pre-wrap; }
  #guide-body { font-size: 14px; line-height: 1.7; color: var(--text); }
  #guide-body .guide-thinking { color: var(--muted); font-size: 13px; }
  #guide-answer-wrap { display: flex; gap: 8px; }
  #guide-answer { flex: 1; min-height: 56px; border: 1px solid var(--border); border-radius: 8px; background: var(--seg-bg); color: var(--text); padding: 8px 10px; font-size: 13px; resize: vertical; font-family: inherit; }
  #guide-answer:focus { outline: none; border-color: var(--accent); }
  #guide-submit { border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: 13px; padding: 0 16px; border-radius: 8px; cursor: pointer; }
  #guide-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #guide-actions button { border: 1px solid var(--border); background: var(--seg-bg); color: var(--text); font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  #guide-actions button:hover { border-color: var(--accent); color: var(--accent); }
  #book-content .guide-cur { background: var(--hl); }
  #book-content .heading.guide-cur { border-radius: 6px; }
  #book-content .seg.guide-cur { border-radius: 4px; }
  #guide-hl-toggle { border: 1px solid var(--border); background: var(--seg-bg); color: var(--muted); font-size: 12px; padding: 3px 10px; border-radius: 20px; cursor: pointer; }
  #guide-hl-toggle.on { color: var(--accent); border-color: var(--accent); }
  .confetti { position: absolute; top: -12px; z-index: 30; pointer-events: none; width: 10px; height: 10px; border-radius: 50%; animation: confetti-fall 2.2s ease-in forwards; }
  @keyframes confetti-fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(90vh) rotate(340deg); opacity: 0; } }
  #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 30; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 20px; padding: 8px 16px; font-size: 13px; box-shadow: 0 6px 20px var(--shadow); display: none; max-width: 80%; text-align: center; }
  #book-content {
    flex: 1; overflow-y: auto; padding: 30px 44px 64px;
    font-family: var(--serif); font-size: var(--book-font-size, 17px); line-height: var(--book-line-height, 1.9); color: var(--book-text);
  }
  #book-content .heading { font-family: var(--serif); font-weight: 700; color: var(--book-text); }
  #book-content .heading.cov-1::before { content: "●"; color: var(--muted); font-size: 8px; margin-right: 7px; vertical-align: 2px; opacity: .55; }
  #book-content .heading.cov-2::before { content: "●"; color: var(--accent); font-size: 9px; margin-right: 7px; vertical-align: 2px; }
  #book-content .heading.cov-3::before { content: "●"; color: var(--accent); font-size: 11px; margin-right: 6px; vertical-align: 1px; text-shadow: 0 0 6px var(--accent); }
  #book-content h2 { font-size: calc(var(--book-font-size, 17px) * 1.32); margin: 34px 0 14px; }
  #book-content h3 { font-size: calc(var(--book-font-size, 17px) * 1.14); margin: 26px 0 10px; }
  #book-content .seg { margin: 0 0 14px; cursor: text; border-radius: 4px; padding: 2px 4px; margin-left: -4px; transition: background .15s; }
  #book-content .seg.hl { background: var(--hl); }
  #book-content .book-fig { margin: 18px 0; text-align: center; }
  #book-content .book-img { max-width: 100%; border-radius: 8px; box-shadow: 0 2px 10px var(--shadow); }
  #book-content .heading.flash { background: var(--accent-soft); border-radius: 4px; }
  /* 正文阅读设置（Aa）：字号 / 背景 / 行距。背景色与主题模式正交——用户选定后固定，其余 UI 仍随主题 */
  #reading-btn { flex: none; border: 1px solid var(--border); background: var(--panel); color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
  #reading-btn:hover { border-color: var(--accent); color: var(--accent); }
  #reading-panel { position: absolute; top: calc(100% + 8px); right: 22px; z-index: 40; display: none; width: 268px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 32px var(--shadow); padding: 12px 14px; }
  #reading-panel.show { display: block; animation: pop-in .22s var(--ease-spring); }
  .rp-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .rp-row + .rp-row { border-top: 1px solid var(--border); }
  .rp-label { font-size: 12px; color: var(--muted); width: 34px; flex: none; }
  #rp-font-down, #rp-font-up { flex: none; width: 32px; height: 26px; padding: 0; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 13px; border-radius: 7px; cursor: pointer; }
  #rp-font-down:hover, #rp-font-up:hover { border-color: var(--accent); color: var(--accent); }
  #rp-font-val { font-size: 13px; color: var(--text); min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
  .rp-swatches { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; align-items: center; }
  .rp-swatch { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer; padding: 0; flex: none; }
  .rp-swatch.active { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rp-swatch.auto { background: linear-gradient(135deg, #ffffff 48%, #333333 52%); }
  .rp-swatch.white { background: #ffffff; }
  .rp-swatch.cream { background: #f7f1e3; }
  .rp-swatch.green { background: #cfe8cf; }
  .rp-swatch.parchment { background: #f2e8d5; }
  .rp-swatch.dark { background: #171717; }
  .rp-seg { display: flex; gap: 2px; background: var(--seg-bg); border-radius: 7px; padding: 2px; flex: 1; }
  .rp-seg button { flex: 1; border: none; background: transparent; color: var(--text); font-size: 12px; padding: 4px 0; border-radius: 5px; cursor: pointer; }
  .rp-seg button.active { background: var(--panel); box-shadow: 0 1px 2px var(--shadow); }
  /* 用户选定的正文背景色（覆盖主题，只作用于书区） */
  #sidebar[data-paper="white"] { --paper: #ffffff; --book-text: #26241f; }
  #sidebar[data-paper="cream"] { --paper: #f7f1e3; --book-text: #2a2925; }
  #sidebar[data-paper="green"] { --paper: #cfe8cf; --book-text: #1f3a1f; }
  #sidebar[data-paper="parchment"] { --paper: #f2e8d5; --book-text: #3a3226; }
  #sidebar[data-paper="dark"] { --paper: #171717; --book-text: #d8d3c8; }
  /* 目录侧栏 */
  #toc { position: relative; z-index: 3; display: none; max-height: 42%; overflow: hidden; border-bottom: 1px solid var(--border); background: var(--panel); padding: 8px 14px; animation: rise-in .2s var(--ease-out); }
  #toc-search { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--text); font-size: 13px; flex: none; }
  #toc-search:focus { outline: none; border-color: var(--accent); }
  #toc-list { max-height: calc(42vh - 66px); overflow-y: auto; }
  #toc-empty { font-size: 12px; color: var(--muted); padding: 6px 8px; }
  #toc-toggle { margin-left: auto; flex: none; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
  #toc-toggle:hover { border-color: var(--accent); color: var(--accent); }
  #key-toggle { flex: none; border: 1px solid var(--border); background: var(--panel); color: var(--muted); font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
  #key-toggle:hover { border-color: var(--accent); color: var(--accent); }
  #key-toggle.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .key-sent { color: var(--accent); font-weight: 700; }
  .nonkey { color: var(--muted); opacity: .55; }
  .toc-item { font-size: 13px; color: var(--text); padding: 4px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toc-item:hover { background: var(--seg-bg); }
  .toc-item.active { background: var(--accent-soft); color: var(--accent); }
  .toc-l2 { padding-left: 8px; }
  .toc-l3 { padding-left: 20px; }
  .toc-l4, .toc-l5, .toc-l6 { padding-left: 30px; font-size: 12px; color: var(--muted); }
  /* 手电筒：暗色遮罩 + 跟着指针的径向光斑（成熟范式：CSS 变量存坐标，radial-gradient 在合成层画光） */
  #flashlight {
    position: absolute; inset: 0; z-index: 2; pointer-events: none; display: none;
    background: radial-gradient(
      ellipse calc(var(--fr, 160px)) calc(var(--fr, 160px) / var(--aspect, 1)) at var(--fx, 50%) var(--fy, 50%),
      rgba(0,0,0,0) 0,
      rgba(0,0,0,0) var(--core, 66%),
      rgba(0,0,0,.94) 100%);
  }

  /* 右：聊天（Apple 风格） */
  #chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  #chat-header { min-height: 52px; padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; background: var(--panel); }
  #tabs { display: flex; gap: 2px; background: var(--seg-bg); border-radius: 9px; padding: 2px; margin-right: auto; }
  .tab { border: none; background: transparent; color: var(--text); font-size: 13px; padding: 5px 14px; border-radius: 7px; cursor: pointer; }
  .tab.active { background: var(--panel); box-shadow: 0 1px 3px var(--shadow); }
  #chat-header select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--panel); color: var(--text); }
  #podcast, #settings-btn { border: 1px solid var(--border); background: var(--panel); color: var(--muted); font-size: 13px; padding: 5px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  #podcast.on { color: #d9433f; border-color: #d9433f; }
  #mode-wrap { position: relative; flex: none; }
  #mode-wrap::before { content: ''; position: absolute; top: -4px; bottom: -4px; right: 100%; width: 10px; }
  #mode-toggle { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 32px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 8px; cursor: pointer; }
  #mode-toggle:hover { color: var(--accent); border-color: var(--accent); }
  #mode-menu { position: absolute; top: 50%; right: 100%; margin-right: 6px; transform: translateY(-50%); z-index: 40; display: none; flex-direction: row; align-items: center; gap: 2px; padding: 5px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 20px var(--shadow); white-space: nowrap; }
  #mode-wrap:hover #mode-menu { display: flex; }
  #mode-menu button { display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent; color: var(--text); font-size: 13px; padding: 6px 9px; border-radius: 7px; cursor: pointer; }
  #mode-menu button:hover { background: var(--seg-bg); }
  #mode-menu button.active { background: var(--accent-soft); color: var(--accent); }
  #settings-overlay { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); animation: fade-in .2s var(--ease-out); }
  #settings-panel { width: min(420px, 92vw); max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.3); padding: 18px; animation: pop-in .26s var(--ease-spring); }
  #settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #settings-title { font-size: 16px; font-weight: 700; color: var(--text); }
  #settings-close { border: none; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; }
  #settings-panel .settings-sec { margin: 14px 0; }
  #settings-panel .settings-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #settings-panel select, #settings-panel input[type=password] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 13px; }
  #settings-key-status { font-size: 12px; margin-bottom: 6px; }
  #settings-key-status.ok { color: #3fae6a; }
  #settings-key-status.warn { color: #d97706; }
  #settings-panel .settings-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  #settings-panel .settings-actions button { border: 1px solid var(--border); background: var(--accent); color: #fff; font-size: 13px; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  #settings-panel .settings-hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { position: relative; max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.7; font-size: 15px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; white-space: pre-wrap; box-shadow: 0 1px 2px var(--shadow); }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 6px; white-space: pre-wrap; box-shadow: 0 1px 3px var(--shadow); }
  .msg.assistant strong { font-weight: 700; }
  .msg.assistant code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .msg.assistant em { font-style: italic; }
  .cite { color: var(--accent); font-weight: 600; cursor: pointer; }
  .cite:hover { text-decoration: underline; }
  #cite-pop { position: fixed; z-index: 100; max-width: 420px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.16); padding: 12px 14px; font-size: 13.5px; line-height: 1.6; display: none; }
  #cite-pop .cite-head { font-weight: 600; color: var(--accent); margin-bottom: 6px; }
  #cite-pop .cite-text { color: var(--text); white-space: pre-wrap; max-height: 260px; overflow-y: auto; }
  .sources { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 6px; }
  .src { font-size: 12.5px; color: var(--muted); cursor: pointer; padding: 2px 0; }
  .src:hover { color: var(--accent); }
  .msg-tools { margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
  .msg-tools button { border: none; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 0; white-space: nowrap; }
  .msg-tools button:hover { color: var(--accent); }
  .read-aloud.speaking { color: var(--accent); font-weight: 600; }
  .msg-tools .delete-msg:hover { color: #d9433f; }
  .msg.user .user-del { position: absolute; top: 5px; right: 7px; border: none; background: transparent; color: rgba(255,255,255,.62); font-size: 12px; cursor: pointer; padding: 2px 5px; border-radius: 4px; opacity: 0; transition: opacity .15s; }
  .msg.user:hover .user-del { opacity: 1; }
  .msg.user .user-del:hover { color: #fff; background: rgba(0,0,0,.25); }
  .collapse { border: none; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 0 2px 10px; }
  .collapse:hover { color: var(--accent); }
  /* 追问线程：子问答缩进挂在父回答下 */
  .thread { margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .msg.collapsed > .thread { display: none; }
  #reply-chip { flex-basis: 100%; display: none; align-items: center; gap: 8px; font-size: 12.5px; color: var(--accent); }
  #reply-chip .reply-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #reply-cancel { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 4px; }
  #reply-cancel:hover { color: var(--accent); }

  /* 思考动画（三点弹跳 + 分阶段文案） */
  .msg.thinking { display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; }
  .thinking-label { color: var(--muted); font-size: 13.5px; }
  .typing { display: inline-flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 推荐问题 / 开场问题 */
  .suggest { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .suggest-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .suggest-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 13px; padding: 6px 12px; border-radius: 16px; cursor: pointer; text-align: left; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* 欢迎页 */
  .welcome { margin: auto; text-align: center; max-width: 400px; padding: 48px 24px; }
  .welcome-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .welcome-sub { font-size: 14px; color: var(--muted); margin-bottom: 26px; line-height: 1.6; }
  .welcome .suggest-list { justify-content: center; }

  /* 空态（还没有书）：正文区 hero + 聊天区三步引导 */
  .empty-state { margin: auto; text-align: center; max-width: 360px; padding: 48px 24px; }
  .empty-icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .empty-icon .ic { width: 34px; height: 34px; }
  .empty-title { font-size: 20px; font-weight: 700; color: var(--book-text); margin-bottom: 8px; }
  .empty-sub { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
  .empty-cta { border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; padding: 11px 26px; border-radius: 22px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .empty-cta:hover { opacity: .92; }
  .empty-formats { font-size: 12px; color: var(--muted); margin-top: 16px; }
  .empty-steps { text-align: left; display: flex; flex-direction: column; gap: 12px; }
  .empty-step { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--text); line-height: 1.5; }
  .es-n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }

  #composer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; background: var(--panel); }
  #input { flex: 1; border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; font-size: 15px; resize: none; font-family: inherit; background: var(--bg); color: var(--text); }
  #input:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  #send { border: none; background: var(--accent); color: #fff; padding: 0 20px; border-radius: 20px; font-size: 14px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  #mic { border: 1px solid var(--border); background: var(--panel); color: var(--text); width: 42px; border-radius: 20px; font-size: 16px; cursor: pointer; flex: none; }
  #mic.listening { background: #d9433f; color: #fff; border-color: #d9433f; animation: pulse 1.2s infinite; }
  #mic.heard { background: #34c759; color: #fff; border-color: #34c759; }
  #mic.transcribing { background: #f5a623; color: #fff; border-color: #f5a623; }
  #mic-level-track { display: none; width: 40px; height: 4px; border-radius: 2px; background: var(--seg-bg); overflow: hidden; flex: none; align-self: center; }
  #mic-level { display: block; height: 100%; width: 0; background: #34c759; border-radius: 2px; transition: width .12s; }
  #podcast-bar { display: none; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--border); background: var(--panel); font-size: 13px; color: var(--muted); flex-wrap: wrap; position: relative; }
  #podcast-bar.show { display: flex; }
  #podcast-status { flex: 1; min-width: 110px; color: var(--text); }
  #podcast-bar select, #podcast-bar button { border: 1px solid var(--border); background: var(--seg-bg); color: var(--text); font-size: 12px; padding: 4px 10px; border-radius: 8px; cursor: pointer; }
  #podcast-bar button:hover { border-color: var(--accent); color: var(--accent); }
  #podcast-more-menu { position: absolute; right: 10px; bottom: calc(100% + 6px); z-index: 25; display: none; flex-direction: column; gap: 2px; min-width: 130px; padding: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 20px var(--shadow); }
  #podcast-more-menu.show { display: flex; }
  #podcast-more-menu button { border: none; background: transparent; color: var(--text); font-size: 12.5px; padding: 6px 8px; border-radius: 6px; cursor: pointer; text-align: left; }
  #podcast-more-menu button:hover { background: var(--seg-bg); color: var(--accent); }
  #podcast-auto.on { color: #fff; background: var(--accent); border-color: var(--accent); }
  #podcast-audio { height: 34px; flex: 1; min-width: 160px; }
  /* 生成播客：居中卡片弹窗（复用设置面板视觉语言） */
  #podcast-options-overlay { position: fixed; inset: 0; z-index: 210; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); }
  #podcast-options-overlay.show { display: flex; animation: fade-in .2s var(--ease-out); }
  #podcast-options { width: min(460px, 92vw); max-height: 88vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.3); padding: 18px; animation: pop-in .26s var(--ease-spring); }
  #podcast-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #podcast-title { font-size: 16px; font-weight: 700; color: var(--text); }
  #podcast-options-close { border: none; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; }
  #podcast-options-close:hover { color: var(--accent); }
  #podcast-options .po-label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  .pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pf-card { text-align: left; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .pf-card:hover { border-color: var(--accent); }
  .pf-card.sel { border-color: var(--accent); background: var(--accent-soft); }
  .pf-name { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .pf-name .ic { color: var(--accent); }
  .pf-desc { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  .seg-group { display: flex; gap: 6px; }
  .seg-group button { flex: 1; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; padding: 8px 0; border-radius: 8px; cursor: pointer; }
  .seg-group button:hover { border-color: var(--accent); color: var(--accent); }
  .seg-group button.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .po-ch-row { display: flex; align-items: center; gap: 8px; }
  .po-count { flex: 1; color: var(--text); font-size: 13px; }
  .po-ch-row button { border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12.5px; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  .po-ch-row button:hover { border-color: var(--accent); color: var(--accent); }
  #podcast-ch-list { max-height: 200px; overflow-y: auto; margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
  #podcast-ch-list label { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; cursor: pointer; color: var(--text); min-width: 0; user-select: none; -webkit-user-select: none; font-size: 13px; }
  #podcast-ch-list.drag-sel { cursor: ns-resize; }
  #podcast-ch-list input { margin: 0; }
  #podcast-instr { width: 100%; box-sizing: border-box; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; padding: 8px 10px; border-radius: 10px; font-family: inherit; resize: vertical; }
  #podcast-instr:focus { outline: none; border-color: var(--accent); }
  #podcast-make { width: 100%; margin-top: 16px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; padding: 12px 0; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  #podcast-make:hover { opacity: .92; }
  #podcast-library { display: none; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--panel); font-size: 12px; }
  #podcast-library.show { display: block; animation: rise-in .2s var(--ease-out); }
  .podcast-lib-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .podcast-lib-head .po-label { flex: 1; color: var(--muted); font-size: 12px; }
  .podcast-lib-head button { border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
  .podcast-lib-head button:hover { border-color: var(--accent); color: var(--accent); }
  .podcast-lib-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .podcast-lib-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); background: var(--bg); border-radius: 10px; }
  .podcast-lib-item .pdl-title { flex: 1; color: var(--text); font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podcast-lib-item .pdl-meta { color: var(--muted); flex: none; font-size: 11.5px; }
  .podcast-lib-item .pdl-play { border: none; background: var(--accent); color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .podcast-lib-item .pdl-play:hover { opacity: .9; }
  .podcast-lib-item .pdl-icon { border: 1px solid var(--border); background: var(--panel); color: var(--text); width: 28px; height: 28px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .podcast-lib-item .pdl-icon:hover { border-color: var(--accent); color: var(--accent); }
  .pdl-empty { color: var(--muted); padding: 12px 0; text-align: center; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(217, 67, 63, .35); } 50% { box-shadow: 0 0 0 6px rgba(217, 67, 63, 0); } }

  /* 选中浮动条 */
  #selbar { position: fixed; display: none; gap: 4px; background: var(--selbar-bg); color: #fff; border-radius: 9px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.28); z-index: 99; }
  #selbar button { border: none; background: transparent; color: #fff; font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  #selbar button:hover { background: var(--selbar-hover); }

  /* 笔记（云文档式：点击即编辑，自动保存） */

  function icon(name, size) {
    const body = ICONS[name] || '';
    return '<svg class="ic' + (size === 'sm' ? ' ic-sm' : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + body + '</svg>';
  }
  function decorateIcons() {
    document.querySelectorAll('[data-icon]').forEach(el => {
      const hasText = el.textContent.trim().length > 0;
      el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon, el.dataset.iconSize) + (hasText ? ' ' : ''));
      if (!hasText) el.classList.add('ic-only');
    });
    document.querySelectorAll('[data-icon-after]').forEach(el => {
      el.insertAdjacentHTML('beforeend', ' ' + icon(el.dataset.iconAfter, el.dataset.iconSize));
    });
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inlineMd(s) {
    return String(s)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*([^*\s][^*]*)\*/g, '<em>$1</em>');
  }
  function md(s) { return inlineMd(esc(s)); }
  function loadJSON(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v === null || v === undefined ? fallback : v; } catch (e) { return fallback; }
  }
  function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}

  let noteContent = '';
  let welcomed = false;
  let sessionNodes = [];      // 会话树节点的扁平列表（按插入序）；节点 {id, role, content, parentId, question, sources}
  let msgSeq = 0;
  let pendingParentId = null; // 追问目标（某条 assistant 消息的 id）
  let pendingQuote = '';      // 追问选中的句子
  let askAbort = null;        // 当前正在进行的提问（切书时取消，避免答案串到新书）
  let keyOn = loadJSON('bt-key', false) === true;
  let keyData = null;         // 当前书的中心句 {paragraphs:[{key:[句子下标]}]}
  let guideHl = loadJSON('bt-guide-hl', true) !== false;      // 跟着读：当前段落高亮开关
  let progress = { coverage: {}, lastPos: 0 };   // 阅读进度/高亮按书隔离
  function progressKey() { return 'bt-progress:' + currentBook; }

  function loadProgress() {

    if (typeof progress.lastPos !== 'number') progress.lastPos = 0;

  // ---------- 会话树：追问线程 ----------
  function nodeById(id) {
    for (let i = 0; i < sessionNodes.length; i++) if (sessionNodes[i].id === id) return sessionNodes[i];
    return null;
  }
  function threadHistory(parentId) {
    const chain = [];
    let n = parentId == null ? null : nodeById(parentId);
    while (n) {
      chain.unshift({ role: n.role, content: n.content });
      n = n.parentId == null ? null : nodeById(n.parentId);
    }
    return chain;
  }
  function lastThreadHistory() {
    const last = sessionNodes.length ? sessionNodes[sessionNodes.length - 1] : null;
    return last ? threadHistory(last.id) : [];
  }
  function closestMsg(node) {
    let el = node && node.nodeType === 1 ? node : (node && node.parentElement);
    while (el && el !== document) {
      if (el.classList && el.classList.contains('msg')) return el;
      el = el.parentElement;
    }
    return null;
  }
  function getThread(parentEl) {
    let t = parentEl.querySelector(':scope > .thread');
    if (!t) {
      t = document.createElement('div');
      t.className = 'thread';
      parentEl.appendChild(t);
      ensureCollapseBtn(parentEl);
    }
    return t;
  }
  function ensureCollapseBtn(parentMsg) {
    const tools = parentMsg.querySelector('.msg-tools');
    if (!tools || tools.querySelector('.collapse')) return;
    const b = document.createElement('button');
    b.className = 'collapse';
    b.innerHTML = icon('chevron-down', 'sm') + ' 收起';

    });
    tools.appendChild(b);
  }
  function setReplyMode(parentMsg) {
    const chip = $('reply-chip');
    const snippet = ((parentMsg && parentMsg.dataset.a) || '').replace(/\s+/g, ' ').slice(0, 40);
    $('reply-label').textContent = snippet ? ('追问：「' + snippet + '…」') : '追问这条回答';
    chip.style.display = 'flex';
  }
  function clearReplyMode() {
    pendingParentId = null; pendingQuote = '';
    $('reply-chip').style.display = 'none';
  }

  // ---------- 显示模式：日间 / 暗夜 / 手电筒 ----------
  let currentMode = 'light';
  function isDarkMode() {
    return currentMode === 'dark';
  }
  function setMode(mode) {
    currentMode = mode;
    try { localStorage.setItem('bt-theme', mode); } catch (e) {}
    const flash = mode === 'flash';
    document.documentElement.setAttribute('data-theme', flash ? 'flash' : mode);
    syncVditorTheme(mode);
    $('flashlight').style.display = flash ? 'block' : 'none';
    $('flash-controls').style.display = flash ? '' : 'none';
    const modeIcon = { light: 'sun', dark: 'moon', flash: 'flashlight' }[mode];
    const modeLabel = { light: '日间', dark: '暗夜', flash: '手电筒' }[mode];
    $('mode-toggle').innerHTML = icon(modeIcon);
    $('mode-toggle').title = modeLabel;
    document.querySelectorAll('#mode-menu button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    if (flash) { initFlashPos(); startFlashlight(); } else { stopFlashlight(); }
  }
  function initTheme() {
    const saved = localStorage.getItem('bt-theme');
    let mode = saved;
    if (mode !== 'light' && mode !== 'dark' && mode !== 'flash') {
      mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    setMode(mode);
  }
  document.querySelectorAll('#mode-menu button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

  // 手电筒：灯光跟随指针（rAF 平滑拖尾；减少动效偏好则直接贴到指针）
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flashTarget = { x: 0, y: 0 }, flashCur = { x: 0, y: 0 }, flashRAF = null;
  // 光圈大小：三套手势（触控板捏合 / Cmd+滚轮 / ↑↓）统一驱动；弥散固定默认值，不再手动调
  const FLASH_R_MIN = 60, FLASH_R_MAX = 460;
  let flashRadius = 160;
  try { const s = Number(localStorage.getItem('bt-flash-radius')); if (s >= FLASH_R_MIN && s <= FLASH_R_MAX) flashRadius = s; } catch (e) {}
  function setFlashRadius(px) {
    flashRadius = Math.max(FLASH_R_MIN, Math.min(FLASH_R_MAX, px));
    $('flashlight').style.setProperty('--fr', flashRadius + 'px');
    try { localStorage.setItem('bt-flash-radius', String(flashRadius)); } catch (e) {}
  }
  function nudgeFlashRadius(delta) { setFlashRadius(flashRadius + delta); }
  function applyFlashShape() {
    const band = document.querySelector('#flash-shape button.active');
    $('flashlight').style.setProperty('--aspect', (band && band.dataset.shape === 'band') ? '3.2' : '1');
  }
  function initFlashPos() {
    const fl = $('flashlight');
    setFlashRadius(flashRadius);
    applyFlashShape();
    const r = fl.getBoundingClientRect();
    flashTarget.x = flashCur.x = r.width / 2;
    flashTarget.y = flashCur.y = r.height * 0.4;
    fl.style.setProperty('--fx', flashCur.x + 'px');
    fl.style.setProperty('--fy', flashCur.y + 'px');
  }
  function stepFlash() {
    const dx = flashTarget.x - flashCur.x, dy = flashTarget.y - flashCur.y;
    if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) {
      flashCur.x = flashTarget.x; flashCur.y = flashTarget.y;
      flashRAF = null;
      return;
    }
    flashCur.x += dx * 0.16; flashCur.y += dy * 0.16;
    const fl = $('flashlight');
    fl.style.setProperty('--fx', flashCur.x + 'px');
    fl.style.setProperty('--fy', flashCur.y + 'px');
    flashRAF = requestAnimationFrame(stepFlash);
  }
  function startFlashlight() {
    if (flashRAF || reducedMotion) return;
    flashRAF = requestAnimationFrame(stepFlash);
  }
  function stopFlashlight() { if (flashRAF) { cancelAnimationFrame(flashRAF); flashRAF = null; } }
  bookContent.addEventListener('mousemove', (e) => {
    if (currentMode !== 'flash') return;
    const r = $('flashlight').getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (reducedMotion) {
      flashCur.x = flashTarget.x = x; flashCur.y = flashTarget.y = y;
      const fl = $('flashlight'); fl.style.setProperty('--fx', x + 'px'); fl.style.setProperty('--fy', y + 'px');
    } else {
      flashTarget.x = x; flashTarget.y = y;
      startFlashlight();
    }
  });
  // 光圈：触控板双指捏合 / 鼠标 Cmd(Ctrl)+滚轮（同一 wheel 事件，pinch 也会带 ctrlKey）
  bookContent.addEventListener('wheel', (e) => {
    if (currentMode !== 'flash') return;
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); nudgeFlashRadius(-e.deltaY * 0.5); }
  }, { passive: false });
  // 光圈：键盘 ↑↓（仅手电筒模式，不拦输入框）
  document.addEventListener('keydown', (e) => {
    if (currentMode !== 'flash') return;
    const t = e.target;
    if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable)) return;
    if (e.key === 'ArrowUp') { e.preventDefault(); nudgeFlashRadius(12); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); nudgeFlashRadius(-12); }
  });
  document.querySelectorAll('#flash-shape button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#flash-shape button').forEach(x => x.classList.toggle('active', x === b));
    applyFlashShape();

  // ---------- 正文阅读设置（Aa）：字号 / 背景 / 行距，正交于主题模式 ----------
  const reading = loadJSON('bt-reading', { size: 17, lh: 1.9, paper: '' });
  function applyReading() {
    const root = document.documentElement;
    root.style.setProperty('--book-font-size', reading.size + 'px');
    root.style.setProperty('--book-line-height', String(reading.lh));
    const side = $('sidebar');
    if (reading.paper) side.setAttribute('data-paper', reading.paper); else side.removeAttribute('data-paper');
    const val = $('rp-font-val'); if (val) val.textContent = reading.size;
    document.querySelectorAll('.rp-swatch').forEach(s => s.classList.toggle('active', (s.dataset.paper || '') === reading.paper));
    document.querySelectorAll('#reading-panel .rp-seg button').forEach(b => b.classList.toggle('active', Number(b.dataset.lh) === reading.lh));
  }
  function saveReading() { saveJSON('bt-reading', reading); applyReading(); }
  function readingSize(delta) { reading.size = Math.max(13, Math.min(24, reading.size + delta)); saveReading(); }
  $('reading-btn').addEventListener('click', (e) => { e.stopPropagation(); $('reading-panel').classList.toggle('show'); });
  $('rp-font-down').addEventListener('click', () => readingSize(-1));
  $('rp-font-up').addEventListener('click', () => readingSize(1));
  document.querySelectorAll('.rp-swatch').forEach(s => s.addEventListener('click', () => { reading.paper = s.dataset.paper || ''; saveReading(); }));
  document.querySelectorAll('#reading-panel .rp-seg button').forEach(b => b.addEventListener('click', () => { reading.lh = Number(b.dataset.lh); saveReading(); }));
  document.addEventListener('click', (e) => { if (!$('reading-panel').contains(e.target) && e.target !== $('reading-btn')) $('reading-panel').classList.remove('show'); });

  // ---------- 书：列表 / 切换 / 导入 ----------
  async function refreshBooks() {
    try {
      const res = await fetch('/api/books');
      const list = await res.json();
      return list.map(b => b.name);
    } catch (e) { return []; }
  }
  async function loadBook(name) {
    const names = await refreshBooks();
    const target = name || (names[0] || '');
    if (!target) {
      $('book-title').textContent = '还没有书';
      bookContent.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">' + icon('book-open') + '</div>' +
          '<div class="empty-title">这里还没有书</div>' +
          '<div class="empty-sub">丢一本 PDF / EPUB / MD / TXT 进来，我边读边陪你聊。</div>' +
          '<button class="empty-cta" id="empty-import">' + icon('plus') + ' 导入第一本书</button>' +
          '<div class="empty-formats">支持 PDF · EPUB · MD · TXT · DOCX</div>' +
        '</div>';
      $('empty-import').addEventListener('click', () => $('import-file').click());
      messages.innerHTML =
        '<div class="welcome">' +
          '<div class="welcome-title">你好，我是你的读书搭子</div>' +
          '<div class="welcome-sub">导入一本书之后，你可以：</div>' +
          '<div class="empty-steps">' +
            '<div class="empty-step"><span class="es-n">1</span> 划重点、记批注、加书签</div>' +
            '<div class="empty-step"><span class="es-n">2</span> 随时问我，或点「跟着读」一段段读</div>' +
            '<div class="empty-step"><span class="es-n">3</span> 读完让两位主播给你聊一期播客</div>' +
          '</div>' +
        '</div>';
      renderRailBooks(names);
      return;
    }
    currentBook = target;
    renderRailBooks(names);
    loadProgress();
    $('book-title').innerHTML = esc(target) + ' <span class="spinner"></span>';
    try {
      const res = await fetch('/api/book/' + encodeURIComponent(target));
      const data = await res.json();
      $('book-title').textContent = data.name || target;
      renderBook(data.markdown || '');
      restorePos();
      if (keyOn) {
        keyData = null;
        try {
          const res2 = await fetch('/api/keypoints?book=' + encodeURIComponent(target));
          keyData = await res2.json();
        } catch (e) { keyData = { paragraphs: [] }; }

      }

    } catch (e) {
      $('book-title').textContent = target + '（加载失败）';
    }
  }
  async function switchBook(name) {
    if (!name || name === currentBook) return;
    if (askAbort) askAbort.abort();   // 取消旧书还没答完的问题，避免答案串到新书
    await saveSession();              // 存当前书的会话
    saveProgress();                   // 存当前书的阅读进度
    if (vditor) saveNotes(false);     // 存当前书的笔记
    stopSpeak();
    currentBook = name;
    sessionNodes = []; msgSeq = 0;
    welcomed = false;
    pendingParentId = null; pendingQuote = ''; clearReplyMode();
    noteContent = '';
    messages.innerHTML = '';
    closeGuide();
    if (vditor) { try { vditor.setValue(''); } catch (e) {} }
    await loadBook(name);
    await loadSession();
    if (vditor) loadNotes();
  }
  $('import-file').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const btn = $('rail-import');
    btn.classList.add('importing');
    btn.innerHTML = icon('plus') + ' 导入中…';
    $('book-title').innerHTML = '正在导入 ' + esc(file.name) + ' … <span class="spinner"></span>';
    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/api/import', { method: 'POST', body: fd });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '导入失败');
      btn.classList.remove('importing');
      btn.innerHTML = icon('plus') + ' 导入新书';
      if (data.name === currentBook) await loadBook(data.name);   // 重导同一本：只刷新正文/索引

      btn.classList.remove('importing');
      btn.innerHTML = icon('plus') + ' 导入新书';
      $('book-title').textContent = '导入失败：' + err;

  function renderBook(md) {
    const lines = md.split('\n');
    let html = '';
    let i = 0, hIdx = 0;
    for (const line of lines) {
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        const lvl = Math.min(h[1].length + 1, 6);
        html += '<h' + lvl + ' class="heading" id="hd-' + (hIdx++) + '">' + esc(h[2].trim()) + '</h' + lvl + '>';
      } else if (line.trim()) {
        const img = line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/);
        if (img) {
          // PDF/EPUB 里的图片（REFERENCED 落盘），正文直接渲染，不占 seg 编号
          const src = (img[2] || '').replace(/"/g, '&quot;');
          const alt = (img[1] || '').replace(/"/g, '&quot;');
          html += '<figure class="book-fig"><img class="book-img" src="' + src + '" alt="' + alt + '" loading="lazy"></figure>';
        } else {
          html += '<p class="seg" id="seg-' + (i++) + '">' + esc(line.trim()) + '</p>';
        }
      }
    }
    bookContent.innerHTML = html;
    bookContent.querySelectorAll('.seg').forEach(s => { s.dataset.plain = s.textContent; });
    applyHighlights();
    applyBookmarks();
    applyAnnotations();
    applyCoverageMarks();
    updateProgressUI();
  }

  // ---------- 中心句：标出每段最值得读的一句，其余变淡（本地抽取式，不耗 API） ----------
  function splitSentences(text) {
    const parts = text.split(/([。！？；!?;])/);
    const out = [];
    for (let i = 0; i < parts.length - 1; i += 2) out.push(parts[i] + parts[i + 1]);
    if (parts.length % 2 === 1 && parts[parts.length - 1].trim()) out.push(parts[parts.length - 1]);
    return out.filter(s => s.trim());
  }
  function applyKeyHighlights() {
    const paragraphs = (keyData && keyData.paragraphs) || [];
    bookContent.querySelectorAll('.seg').forEach((seg, i) => {
      const key = paragraphs[i] ? paragraphs[i].key : null;
      const plain = seg.dataset.plain || seg.textContent;
      if (keyOn && key && key.length) {
        const keySet = new Set(key);
        seg.innerHTML = splitSentences(plain).map((s, idx) =>
          keySet.has(idx)
            ? '<span class="key-sent">' + esc(s) + '</span>'
            : '<span class="nonkey">' + esc(s) + '</span>'
        ).join('');
      } else {
        seg.innerHTML = esc(plain);
      }
    });
  }
  async function toggleKey() {

    }
    applyKeyHighlights();
  }
  $('key-toggle').addEventListener('click', toggleKey);

  // ---------- 目录侧栏 ----------
  function buildTOC() {
    const list = $('toc-list');
    const heads = [...bookContent.querySelectorAll('.heading')];
    list.innerHTML = '';
    if (!heads.length) { list.innerHTML = '<div class="muted">（本书没有检测到标题）</div>'; return; }
    heads.forEach(h => {
      const item = document.createElement('div');
      item.className = 'toc-item toc-l' + h.tagName.replace('H', '');
      item.textContent = h.textContent.trim();
      item.dataset.target = h.id;
      item.dataset.title = h.textContent.trim().toLowerCase();
      item.addEventListener('click', () => {
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        syncChapterActive(h.id);
        // 轴上的对应章节滚进视野，两边点哪跳到哪
        const railCh = document.querySelector('#rail-overview .rl-ch[data-target="' + h.id + '"]');
        if (railCh) railCh.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      list.appendChild(item);
    });
    filterTOC();
  }
  function filterTOC() {
    const q = $('toc-search').value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll('#toc-list .toc-item').forEach(it => {
      const hit = !q || (it.dataset.title || '').includes(q);
      it.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    let empty = $('toc-empty');
    if (!q || shown > 0) { if (empty) empty.remove(); return; }
    if (!empty) {
      empty = document.createElement('div');
      empty.id = 'toc-empty';
      empty.textContent = '没有匹配的章节';
      $('toc-list').appendChild(empty);
    }
  }
  $('toc-search').addEventListener('input', filterTOC);
  function toggleTOC() {
    const toc = $('toc');
    const show = toc.style.display === 'none';
    toc.style.display = show ? 'block' : 'none';
    if (show) { buildTOC(); updateTocActive(); }
  }
  // 当前所在章节：目录与阅读轴共用同一份参照，保证两边联动一致
  function currentHeadingId() {
    const bcTop = bookContent.getBoundingClientRect().top;
    const heads = [...bookContent.querySelectorAll('.heading')];
    let cur = null;
    for (const h of heads) {
      if (h.getBoundingClientRect().top - bcTop <= 48) cur = h;
      else break;

    return cur ? cur.id : null;
  }
  // 点目录 / 点轴上的章节后，把两边的「当前章节」高亮同步对齐
  function syncChapterActive(id) {
    document.querySelectorAll('#toc .toc-item').forEach(it =>
      it.classList.toggle('active', it.dataset.target === id));
    document.querySelectorAll('#rail-overview .rl-ch').forEach(ch =>
      ch.classList.toggle('active', ch.dataset.target === id));

  let tocRAF = null;
  function updateTocActive() {
    if ($('toc').style.display === 'none') return;
    if (tocRAF) return;
    tocRAF = requestAnimationFrame(() => {
      tocRAF = null;
      const cur = currentHeadingId();
      document.querySelectorAll('#toc .toc-item').forEach(it =>
        it.classList.toggle('active', cur !== null && it.dataset.target === cur));
    });
  }
  let railActiveRAF = null;
  function updateRailActive() {
    if (railActiveRAF) return;
    railActiveRAF = requestAnimationFrame(() => {
      railActiveRAF = null;

        ch.classList.toggle('active', cur !== null && ch.dataset.target === cur));

  // ---------- Dock 式悬停放大（macOS 任务栏效果） ----------
  // 作用于「一排标记」（进度条刻度横向 / 左栏便签纵向）：鼠标靠近哪个，哪个按距离放大。
  // 只写 CSS 变量 --dock，不动宽高、不触发重排；元素自身 CSS 里用 scale(var(--dock,1))。
  function attachDockMagnify(container, itemSelector, opts) {
    if (!container) return;
    const maxScale = (opts && opts.maxScale) || 2;
    const radius = (opts && opts.radius) || 80;
    const axis = (opts && opts.axis) || 'x';
    const items = () => container.querySelectorAll(itemSelector);
    let raf = 0;
    function apply(coord) {
      items().forEach(el => {
        const r = el.getBoundingClientRect();
        const center = axis === 'y' ? (r.top + r.height / 2) : (r.left + r.width / 2);
        const d = Math.abs(center - coord);
        const t = Math.max(0, 1 - d / radius);
        el.style.setProperty('--dock', (1 + (maxScale - 1) * t * t).toFixed(3));
      });
    }
    container.addEventListener('mousemove', (e) => {
      const coord = axis === 'y' ? e.clientY : e.clientX;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => apply(coord));
    });
    container.addEventListener('mouseleave', () => {
      items().forEach(el => el.style.setProperty('--dock', '1'));
    });
  }

  // ---------- 书签 ----------
  function bmKey() { return 'bt-bm:' + currentBook; }
  function toggleBookmark(seg) {
    if (!seg || !seg.id) return;
    const bms = loadJSON(bmKey(), []);
    const i = bms.findIndex(b => b.segId === seg.id);
    if (i >= 0) bms.splice(i, 1); else bms.push({ id: 'bm' + Date.now(), segId: seg.id, created: Date.now() });
    saveJSON(bmKey(), bms);
    applyBookmarks();
  }
  function applyBookmarks() {
    const bms = loadJSON(bmKey(), []);
    document.querySelectorAll('#book-content .seg.bm').forEach(s => s.classList.remove('bm'));
    bms.forEach(b => { const el = document.getElementById(b.segId); if (el) el.classList.add('bm'); });
    renderBookmarkTicks();
    renderRailOverview();
  }
  function renderBookmarkTicks() {
    const wrap = $('progress-ticks');
    if (!wrap) return;
    wrap.innerHTML = '';
    const bms = loadJSON(bmKey(), []);
    const total = bookContent.scrollHeight || 1;
    const box = bookContent.getBoundingClientRect();
    bms.forEach(b => {
      const el = document.getElementById(b.segId);
      if (!el) return;
      const segTop = el.getBoundingClientRect().top - box.top + bookContent.scrollTop;
      const frac = Math.min(1, Math.max(0, segTop / total));
      const t = document.createElement('div');
      t.className = 'bm-tick';
      t.title = (el.textContent || '').slice(0, 40);
      t.style.left = (frac * 100) + '%';
      t.addEventListener('click', (e) => { e.stopPropagation(); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
      wrap.appendChild(t);
    });
  }

  // ---------- 左侧折叠菜单：书籍 + 批注/书签便签概览 ----------
  function segOrder() {
    const map = {};
    document.querySelectorAll('#book-content .seg').forEach((s, i) => { map[s.id] = i; });
    return map;
  }
  function renderRailBooks(names) {
    const wrap = $('rail-books');
    if (!wrap) return;
    wrap.innerHTML = '';
    if (!names || !names.length) { wrap.innerHTML = '<div class="rail-empty">还没有书，点上方「＋ 导入新书」</div>'; return; }
    names.forEach(name => {
      const el = document.createElement('div');
      el.className = 'rail-book' + (name === currentBook ? ' active' : '');
      const label = document.createElement('span');
      label.className = 'rail-book-name';
      label.textContent = name;
      label.title = name;
      const del = document.createElement('button');
      del.className = 'rail-book-del';
      del.title = '删除这本书';
      del.innerHTML = icon('trash-2', 'sm');
      del.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('确定删除《' + name + '》？本地索引、笔记、批注、书签、播客都会清空，不可恢复。')) return;
        try {
          const res = await fetch('/api/book/' + encodeURIComponent(name), { method: 'DELETE' });
          const r = await res.json();
          if (!r.ok) throw new Error(r.detail || '删除失败');
          clearBookLocal(name);
          const remaining = (await refreshBooks()).filter(n => n !== name);
          if (name === currentBook) {
            currentBook = '';
            await loadBook(remaining[0] || '');
          } else {
            renderRailBooks(remaining);
          }
          toast('已删除《' + name + '》');
        } catch (err) {
          toast('删除失败：' + (err && err.message ? err.message : err));
        }
      });
      el.appendChild(label);
      el.appendChild(del);
      el.addEventListener('click', () => { if (name !== currentBook) switchBook(name); });
      wrap.appendChild(el);
    });
  }
  function clearBookLocal(name) {
    ['bt-bm', 'bt-annot', 'bt-progress', 'bt-hl'].forEach(k => {
      try { localStorage.removeItem(k + ':' + name); } catch (e) {}
    });
  }
  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return hm;
    if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm;
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm;
  }
  // 文档顺序位置：把 .heading + .seg 按出现顺序映射成 0..1 的轴坐标（目录作为参照）。
  // 全书轴有几百个标题+几千个段落，滚动时每帧重算会卡，所以缓存；renderRailOverview 里失效重建。
  let docPosCache = null;
  function buildDocPos() {
    if (docPosCache) return docPosCache;
    const nodes = [...bookContent.querySelectorAll('.heading, .seg')];
    const map = {};
    const last = Math.max(nodes.length - 1, 1);
    nodes.forEach((nd, i) => { map[nd.id] = i / last; });
    docPosCache = map;
    return map;
  }
  // 阅读轴 = 全书目录（像 Word 导航 / 论文目录那样列全，一点就跳），
  // 有批注/书签的章节在章节名下挂卡片，绿色「你在此」标当前章。
  function segHeadingEl(seg) {
    let el = seg.previousElementSibling;
    while (el) {
      if (el.classList && el.classList.contains('heading')) return el;
      el = el.previousElementSibling;
    }
    return null;
  }
  function appendRailMark(inner, it) {
    const seg = document.getElementById(it.segId);
    const pos = buildDocPos();
    const text = it.kind === 'annot' ? (it.comment || '（无文字）') : ((seg.textContent || '').trim().slice(0, 60) || '（空段）');
    const jump = () => {
      seg.scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (it.kind === 'annot') openAnnotView(seg);
    };

    const row = document.createElement('div');
    row.className = 'rl-row';
    row.dataset.pos = String(pos[it.segId] ?? 0);

    const dot = document.createElement('div');
    dot.className = 'rl-dot ' + it.kind;
    dot.title = fmtTime(it.created) + ' ' + text;
    const conn = document.createElement('div');
    conn.className = 'rl-conn';

    const card = document.createElement('div');
    card.className = 'rail-card ' + it.kind;
    card.innerHTML =
      '<div class="rc-head"><span class="rc-kind">' + (it.kind === 'annot' ? '批注' : '书签') + '</span><span>' + esc(fmtTime(it.created)) + '</span></div>' +
      '<div class="rc-text">' + esc(text) + '</div>' +
      '<button class="rc-del" title="删除">' + icon('x', 'sm') + '</button>';
    card.querySelector('.rc-del').addEventListener('click', (e) => {
      e.stopPropagation();
      if (it.kind === 'annot') deleteAnnotation(it.id); else toggleBookmark(seg);
    });

    row.appendChild(dot);
    row.appendChild(conn);
    row.appendChild(card);
    row.addEventListener('click', (e) => { if (e.target.closest('.rc-del')) return; jump(); });
    inner.appendChild(row);
  }
  function renderRailOverview() {
    const overview = $('rail-overview');
    if (!overview) return;
    docPosCache = null;   // 全书结构可能变了（换书/重渲染），失效重建
    overview.innerHTML = '';
    const inner = document.createElement('div');
    inner.className = 'rl-inner';
    overview.appendChild(inner);

    const pos = buildDocPos();
    const annots = loadJSON(annotKey(), []).map(a => ({ ...a, kind: 'annot' }));
    const bms = loadJSON(bmKey(), []).map(b => ({ ...b, kind: 'bm' }));
    const marks = annots.concat(bms).filter(it => document.getElementById(it.segId));

    // 标记按章节分组
    const byChapter = new Map();   // headingId -> marks[]
    marks.forEach(it => {
      const h = segHeadingEl(document.getElementById(it.segId));
      const key = h ? h.id : '__none__';
      if (!byChapter.has(key)) byChapter.set(key, []);
      byChapter.get(key).push(it);
    });

    const heads = [...bookContent.querySelectorAll('.heading')];
    if (!heads.length && !marks.length) {
      inner.innerHTML = '<div class="rail-empty">（本书没有检测到标题）</div>';
      return;
    }

    // 正文开头（还没有任何标题）的标记，放最上面
    if (byChapter.has('__none__')) byChapter.get('__none__').forEach(it => appendRailMark(inner, it));

    // 全书目录列全：每个标题一行（可点跳），有标记的章节在下面挂卡片
    heads.forEach(h => {
      const ch = document.createElement('div');
      ch.className = 'rl-ch' + (h.tagName === 'H2' ? ' hd-1' : '');
      const chText = document.createElement('span');
      chText.className = 'rl-ch-text';
      chText.textContent = h.textContent.trim();
      ch.appendChild(chText);
      ch.title = h.textContent.trim();
      ch.dataset.pos = String(pos[h.id] ?? 0);
      ch.dataset.target = h.id;
      ch.addEventListener('click', () => {
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        syncChapterActive(h.id);
      });
      inner.appendChild(ch);
      (byChapter.get(h.id) || [])
        .sort((a, b) => (pos[a.segId] ?? 0) - (pos[b.segId] ?? 0))
        .forEach(it => appendRailMark(inner, it));
    });

    updateRailActive();
  }

  // ---------- 批注 ----------
  function annotKey() { return 'bt-annot:' + currentBook; }
  function addAnnotation(seg, exact, comment) {
    if (!seg || !seg.id || !(comment || '').trim()) return;
    const annots = loadJSON(annotKey(), []);
    annots.push({ id: 'a' + Date.now(), segId: seg.id, exact: (exact || '').replace(/\s+/g, ' '), comment: comment.trim(), created: Date.now() });
    saveJSON(annotKey(), annots);
    applyAnnotations();
  }
  function deleteAnnotation(id) {
    let annots = loadJSON(annotKey(), []);
    annots = annots.filter(a => a.id !== id);
    saveJSON(annotKey(), annots);
    applyAnnotations();
    hideAnnotPop();
  }
  function applyAnnotations() {
    const annots = loadJSON(annotKey(), []);
    document.querySelectorAll('#book-content .seg.annot').forEach(s => {
      s.classList.remove('annot');
      const t = s.querySelector('.annot-tag'); if (t) t.remove();
    });
    annots.forEach(a => {
      const seg = document.getElementById(a.segId);
      if (!seg) return;
      seg.classList.add('annot');
      let tag = seg.querySelector('.annot-tag');
      if (!tag) {
        tag = document.createElement('span');
        tag.className = 'annot-tag';
        tag.innerHTML = icon('message-square', 'sm');
        tag.title = '查看批注';
        tag.addEventListener('click', (e) => { e.stopPropagation(); openAnnotView(seg); });
        seg.insertBefore(tag, seg.firstChild);
      }
    });
    renderRailOverview();
  }
  function showAnnotPop(rect) {
    const p = $('annot-pop');
    p.style.display = 'block';
    p.style.top = Math.max(8, (rect.bottom || 0) + 6) + 'px';
    p.style.left = Math.max(8, Math.min((rect.left || 0), window.innerWidth - 296)) + 'px';
  }
  function hideAnnotPop() { const p = $('annot-pop'); if (p) p.style.display = 'none'; }
  function openAnnotInput(seg, exact) {
    const p = $('annot-pop');
    p.innerHTML = '<textarea id="annot-input" placeholder="写点批注…"></textarea>' +
      '<div class="annot-pop-actions"><button id="annot-cancel">取消</button><button id="annot-save">保存</button></div>';
    $('annot-cancel').onclick = hideAnnotPop;
    $('annot-save').onclick = () => { addAnnotation(seg, exact, $('annot-input').value); hideAnnotPop(); };
    showAnnotPop(seg.getBoundingClientRect());
    setTimeout(() => { const t = $('annot-input'); if (t) t.focus(); }, 0);
  }
  function openAnnotView(seg) {
    const annots = loadJSON(annotKey(), []).filter(a => a.segId === seg.id);
    const p = $('annot-pop');
    if (!annots.length) { hideAnnotPop(); return; }
    p.innerHTML = annots.map(a =>
      '<div class="annot-item"><button class="a-del" title="删除">' + icon('x', 'sm') + '</button>' +
      '<div class="a-exact">' + esc(a.exact || '') + '</div>' +
      '<div class="a-comment">' + esc(a.comment) + '</div></div>'
    ).join('') +
      '<div class="annot-pop-actions"><button id="annot-add">＋ 加一条</button></div>';
    p.querySelectorAll('.annot-item').forEach((el, i) => {
      el.querySelector('.a-del').onclick = () => deleteAnnotation(annots[i].id);
    });
    $('annot-add').onclick = () => openAnnotInput(seg, '');
    showAnnotPop(seg.getBoundingClientRect());
  }

  // ---------- 阅读进度（按交互权重，滚动只记「上次读到哪」） ----------
  function saveProgress() { saveJSON(progressKey(), progress); }
  function segHeading(seg) {
    let el = seg.previousElementSibling;
    while (el) {
      if (el.classList && el.classList.contains('heading')) return el.textContent.trim();
      el = el.previousElementSibling;
    }
    return null;
  }
  function bump(heading, lvl) {
    if (!heading) return;
    if (!progress.coverage[heading] || progress.coverage[heading] < lvl) progress.coverage[heading] = lvl;
  }
  function coverageStats() {
    const heads = [...document.querySelectorAll('#book-content .heading')];
    const total = heads.length || 1;
    let m = 0, d = 0, c = 0;
    for (const h of heads) {
      const lvl = progress.coverage[h.textContent.trim()] || 0;
      if (lvl >= 1) m++;
      if (lvl >= 2) d++;
      if (lvl >= 3) c++;
    }
    // 主进度 = 读过几章（翻书/提问都算「读过」），讨论/深读是附加深度
    return { pct: Math.round(m / total * 100), total: heads.length, m, d, c };
  }
  function updateProgressUI() {
    const s = coverageStats();
    $('progress-fill').style.width = s.pct + '%';
    $('progress-label').textContent = '已读 ' + s.m + '/' + s.total + ' 章 · 讨论 ' + s.d + ' · 深读 ' + s.c;
  }
  function restorePos() {
    // 打开书时回到上次读到的地方（书签 lastPos）
    const max = bookContent.scrollHeight - bookContent.clientHeight;
    if (max > 0 && progress.lastPos > 0) bookContent.scrollTop = max * progress.lastPos;
  }
  function applyCoverageMarks() {
    document.querySelectorAll('#book-content .heading').forEach(h => {
      h.classList.remove('cov-1', 'cov-2', 'cov-3');
      const lvl = progress.coverage[h.textContent.trim()] || 0;
      if (lvl >= 1) h.classList.add('cov-' + Math.min(lvl, 3));
    });
  }
  function markCoverage(sources) {
    if (!sources || !sources.length) return;
    sources.forEach((s, i) => {
      const heading = s.heading;
      if (!heading) return;
      const cur = progress.coverage[heading] || 0;
      let lvl = 1;                      // 提及：被引用
      if (i === 0) lvl = 2;             // 讨论：本次问题的核心来源
      if (i === 0 && cur >= 2) lvl = 3; // 覆盖：反复深挖同一章
      if (lvl > cur) progress.coverage[heading] = lvl;
    });
    saveProgress();
    applyCoverageMarks();
    updateProgressUI();
  }
  let scrollTimer = null;
  // 滚到哪个标题，就把它记作「读过」（level 1）：光翻书也算进度，不用非得提问
  function markScrolledHeadings() {
    const top = bookContent.getBoundingClientRect().top + 24;
    const heads = [...bookContent.querySelectorAll('.heading')];
    let last = null;
    for (const h of heads) {
      if (h.getBoundingClientRect().top <= top) last = h; else break;
    }
    if (!last) return;
    const heading = last.textContent.trim();
    if (!progress.coverage[heading]) {
      progress.coverage[heading] = 1;
      updateProgressUI();
      last.classList.add('cov-1');
    }
  }
  bookContent.addEventListener('scroll', () => {
    const max = bookContent.scrollHeight - bookContent.clientHeight;
    if (max <= 0) return;
    progress.lastPos = bookContent.scrollTop / max;   // 书签：上次读到哪
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => { markScrolledHeadings(); saveProgress(); }, 400);
  });
  // 关页/切后台也存一次，别丢进度
  window.addEventListener('beforeunload', saveProgress);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveProgress(); });
  $('progress-bar').addEventListener('click', () => {
    const max = bookContent.scrollHeight - bookContent.clientHeight;
    bookContent.scrollTop = max * (progress.lastPos || 0);
  });

  // ---------- 思考动画 ----------
  const THINK_STAGES = ['正在检索书里相关内容…', '正在思考…', '正在组织语言…'];
  function addThinking() {
    const div = document.createElement('div');
    div.className = 'msg assistant thinking';
    div.innerHTML = '<span class="thinking-label">正在思考…</span><span class="typing"><i></i><i></i><i></i></span>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    let s = 0;
    div._timer = setInterval(() => {
      s = (s + 1) % THINK_STAGES.length;

      if (label) label.textContent = THINK_STAGES[s];

  function removeThinking(div) {
