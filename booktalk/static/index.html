  function downloadNote(name, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    $('messages').style.display = name === 'chat' ? 'flex' : 'none';
    $('composer').style.display = name === 'chat' ? 'flex' : 'none';
    $('pane-notes').style.display = name === 'notes' ? 'flex' : 'none';
    if (name === 'notes') { initNotes(); loadNotes(); }
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  $('note-download').addEventListener('click', () => {
    saveNotes(false);
    downloadNote('笔记.md', noteContent, 'text/markdown;charset=utf-8');
  });
  $('note-download-html').addEventListener('click', () => {
    const html = vditor ? (vditor.getHTML() || '') : '';
    downloadNote('笔记.html', '<!doctype html><meta charset="utf-8"><title>笔记</title>' + html, 'text/html;charset=utf-8');
  });
  $('note-copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(noteContent); $('notes-status').textContent = '已复制'; }
    catch (e) { $('notes-status').textContent = '复制失败'; }
    setTimeout(() => { $('notes-status').textContent = ''; }, 1500);
  });

  // ---------- 自动整理：按章节归位 + 溯源 + 保留上下文（可撤销） ----------
  let preOrganize = '';
  async function organizeNotes() {
    if (!noteContent.trim()) {
      $('notes-status').textContent = '还没有笔记可整理';
      setTimeout(() => { $('notes-status').textContent = ''; }, 1500);
      return;
    }
    const btn = $('note-organize');
    btn.disabled = true;
    btn.textContent = '整理中…';
    const s = coverageStats();
    const progress = '已读 ' + s.m + ' / 共 ' + s.total + ' 章 · 讨论 ' + s.d + ' · 深读 ' + s.c;
    try {
      const res = await fetch('/api/notes/organize?book=' + encodeURIComponent(currentBook), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: noteContent, progress })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '整理失败');
      preOrganize = noteContent;
      noteContent = data.content || noteContent;
      if (vditor) vditor.setValue(noteContent);
      updateNoteCount();
      await saveNotes(false);
      btn.textContent = '↩️ 撤销整理';
      btn.dataset.undo = '1';
      $('notes-status').textContent = '已整理（可撤销）';
      setTimeout(() => { $('notes-status').textContent = ''; }, 4000);
    } catch (e) {
      btn.textContent = '✨ 自动整理';
      $('notes-status').textContent = '整理失败：' + e.message;
      setTimeout(() => { $('notes-status').textContent = ''; }, 4000);
    } finally {
      btn.disabled = false;
    }
  }
  $('note-organize').addEventListener('click', () => {
    const btn = $('note-organize');
    if (btn.dataset.undo) {
      noteContent = preOrganize || noteContent;
      if (vditor) vditor.setValue(noteContent);
      updateNoteCount();
      saveNotes(false);
      preOrganize = '';
      btn.dataset.undo = '';
      btn.textContent = '✨ 自动整理';
      $('notes-status').textContent = '已撤销';
      setTimeout(() => { $('notes-status').textContent = ''; }, 1500);
      return;
    }
    organizeNotes();
  });

  // ---------- 跟着读（主动阅读循环：节奏 + 主动回忆 + 复盘） ----------
  let guideSections = [];     // 每段 = 一个标题 + 其下若干段
  let guideIdx = -1;          // 当前读到第几段
  let guideQuestion = '';     // 「考考我」出的问题，提交答案时带回给 AI 评价

  function buildSections() {
    const sections = [];
    let cur = null;
    for (const el of bookContent.children) {
      if (el.classList.contains('heading')) {
        cur = { heading: el.textContent.trim(), headingEl: el, segs: [] };
        sections.push(cur);
      } else if (el.classList.contains('seg')) {
        if (!cur) { cur = { heading: '（开篇）', headingEl: null, segs: [] }; sections.push(cur); }
        cur.segs.push(el);
      }
    }
    sections.forEach(s => {
      const segText = s.segs.map(e => e.dataset.plain || e.textContent).join('\n');
      const head = (s.heading && s.heading !== '（开篇）') ? s.heading + '。' : '';
      s.text = head + segText;
      s.preview = segText.replace(/\s+/g, ' ').slice(0, 140);
    });
    return sections;
  }
  function currentSection() {
    if (!guideSections.length) return null;
    if (guideIdx < 0 || guideIdx >= guideSections.length) guideIdx = 0;
    return guideSections[guideIdx];
  }
  function currentSectionIndex() {
    const top = bookContent.getBoundingClientRect().top + 60;
    let idx = 0;
    for (let i = 0; i < guideSections.length; i++) {
      const el = guideSections[i].headingEl || guideSections[i].segs[0];
      if (!el) continue;
      if (el.getBoundingClientRect().top <= top) idx = i; else break;
    }
    return idx;
  }
  function clearGuideHighlight() {
    document.querySelectorAll('#book-content .guide-cur').forEach(el => el.classList.remove('guide-cur'));
  }
  function highlightCurrent() {
    clearGuideHighlight();
    if (!guideHl) return;
    const s = currentSection();
    if (!s) return;
    const els = s.headingEl ? [s.headingEl, ...s.segs] : s.segs;
    els.forEach(el => el.classList.add('guide-cur'));
  }
  function showGuideAnswer() { $('guide-answer-wrap').style.display = 'flex'; $('guide-answer').value = ''; $('guide-answer').focus(); }
  function hideGuideAnswer() { $('guide-answer-wrap').style.display = 'none'; }
  function closeGuide() { $('guide-panel').style.display = 'none'; clearGuideHighlight(); }

  // 读完一段的轻庆祝：撒花（无依赖）+ 一句提醒
  function celebrate() {
    const host = $('sidebar');
    const emojis = ['🎉', '✨', '🌸', '🎊', '💫', '⭐'];
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = (8 + Math.random() * 82) + '%';
      s.style.animationDelay = (Math.random() * 0.4) + 's';
      s.style.fontSize = (14 + Math.random() * 18) + 'px';
      host.appendChild(s);
      setTimeout(() => s.remove(), 2600);
    }
  }
  let toastTimer = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2800);
  }

  function renderGuideChunk() {
    const s = currentSection();
    if (!s) { $('guide-body').innerHTML = '<div class="guide-thinking">这本书还没有可读内容</div>'; return; }
    $('guide-title').textContent = '跟着读 · 第 ' + (guideIdx + 1) + ' 段';
    $('guide-chunk-heading').textContent = s.heading || '（未分章）';
    $('guide-chunk-preview').textContent = s.preview;
    $('guide-body').innerHTML = '';
    hideGuideAnswer();
    guideQuestion = '';
    highlightCurrent();
    (s.headingEl || s.segs[0]).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function guideStream(body, targetEl) {
    const res = await fetch('/api/guide', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        let ev; try { ev = JSON.parse(line); } catch (e) { continue; }
        if (ev.type === 'delta') { text += ev.text; targetEl.innerHTML = fmtAnswer(text); }
      }
    }
    return text;
  }

  async function guideAction(mode) {
    const s = currentSection();
    if (!s) return;
    hideGuideAnswer();
    const bodyEl = $('guide-body');
    bodyEl.innerHTML = '<div class="guide-thinking">' + (mode === 'quiz' ? '在想怎么考你…' : '…') + '</div>';
    try {
      const text = await guideStream({
        context: s.text, heading: s.heading, mode,
        persona: $('persona-select').value || 'default', book: currentBook
      }, bodyEl);
      if (mode === 'quiz') { guideQuestion = text.trim(); showGuideAnswer(); }
    } catch (e) {
      bodyEl.innerHTML = '<div class="muted">出错了：' + esc(e) + '</div>';
    }
  }

  async function submitGuideAnswer() {
    const s = currentSection();
    const ans = $('guide-answer').value.trim();
    if (!s || !ans) return;
    hideGuideAnswer();
    const bodyEl = $('guide-body');
    bodyEl.innerHTML = '<div class="guide-thinking">…</div>';
    try {
      await guideStream({
        context: s.text, heading: s.heading, mode: 'evaluate',
        question: guideQuestion, answer: ans,
        persona: $('persona-select').value || 'default', book: currentBook
      }, bodyEl);
    } catch (e) {
      bodyEl.innerHTML = '<div class="muted">出错了：' + esc(e) + '</div>';
    }
  }

  async function runGuideRecap() {
    const bodyEl = $('guide-body');
    hideGuideAnswer();
    guideQuestion = '';
    clearGuideHighlight();
    $('guide-title').textContent = '复盘';
    $('guide-chunk-heading').textContent = '我读到哪了？';
    $('guide-chunk-preview').textContent = '';
    bodyEl.innerHTML = '<div class="guide-thinking">在回想你读到哪了…</div>';
    try {
      const s = coverageStats();
      const recent = sessionNodes.slice(-6).map(n =>
        (n.role === 'user' ? '你问：' : '我答：') + (n.content || '').replace(/\s+/g, ' ').slice(0, 120)
      ).join('\n');
      const context = '已读进度：约 ' + s.pct + '%（已读 ' + s.m + ' / 共 ' + s.total + ' 章，讨论 ' + s.d + ' · 深读 ' + s.c + '）\n最近对话：\n' + (recent || '（还没有对话）');
      await guideStream({
        context, heading: currentBook, mode: 'recap',
        persona: $('persona-select').value || 'default', book: currentBook
      }, bodyEl);
    } catch (e) {
      bodyEl.innerHTML = '<div class="muted">出错了：' + esc(e) + '</div>';
    }
  }

  function openGuide(mode) {
    guideSections = buildSections();
    if (!guideSections.length) { closeGuide(); return; }
    guideIdx = currentSectionIndex();
    $('guide-panel').style.display = 'flex';
    $('guide-hl-toggle').classList.toggle('on', guideHl);
    $('guide-hl-toggle').textContent = guideHl ? '高亮' : '高亮已关';
    if (mode === 'recap') runGuideRecap(); else renderGuideChunk();
  }

  $('guide-open').addEventListener('click', () => openGuide('chunk'));
  $('guide-recap-btn').addEventListener('click', () => openGuide('recap'));
  $('guide-close').addEventListener('click', closeGuide);
  $('guide-hl-toggle').addEventListener('click', () => {
    guideHl = !guideHl;
    saveJSON('bt-guide-hl', guideHl);
    $('guide-hl-toggle').classList.toggle('on', guideHl);
    $('guide-hl-toggle').textContent = guideHl ? '高亮' : '高亮已关';
    highlightCurrent();
  });
  $('guide-next').addEventListener('click', () => {
    celebrate();
    toast('读完这一段啦 🎉 要不要聊聊 / 考考我？');
    guideIdx++;
    renderGuideChunk();
  });
  $('guide-discuss').addEventListener('click', () => {
    const s = currentSection();
    if (!s) return;
    switchTab('chat');
    ask('我刚读完这一段，想跟你聊聊：先一句话点出它最关键的一点，再问我一个问题让我参与进来（比如我的看法、联想到什么）。', null, { text: s.text, heading: s.heading });
  });
  $('guide-quiz').addEventListener('click', () => guideAction('quiz'));
  $('guide-submit').addEventListener('click', submitGuideAnswer);
  $('guide-answer').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitGuideAnswer(); }
  });

  // ---------- 设置面板 ----------
  function openSettings() {
    $('settings-overlay').style.display = 'flex';
    refreshSettingsStatus();
  }
  function closeSettings() { $('settings-overlay').style.display = 'none'; }
  async function refreshSettingsStatus() {
    const el = $('settings-key-status');
    try {
      const res = await fetch('/api/settings');
      const s = await res.json();
      el.textContent = s.has_key ? ('已配置 · 模型 ' + s.model) : '尚未配置，请粘贴你的 API Key';
      el.className = s.has_key ? 'ok' : 'warn';
      if (!s.has_key) $('settings-key').value = '';
    } catch (e) {
      el.textContent = '读取设置失败';
      el.className = 'warn';
    }
  }
  async function saveSettingsKey() {
    const key = $('settings-key').value.trim();
    if (!key) { toast('请先粘贴 API Key'); return; }
    const res = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ api_key: key }) });
    const r = await res.json();
    if (r.ok) { toast('已保存，下次问答即用新 Key'); $('settings-key').value = ''; refreshSettingsStatus(); }
    else { toast(r.error || '保存失败'); }
  }
  $('settings-btn').addEventListener('click', openSettings);
  $('settings-close').addEventListener('click', closeSettings);
  $('settings-key-save').addEventListener('click', saveSettingsKey);
  $('settings-overlay').addEventListener('mousedown', (e) => { if (e.target === $('settings-overlay')) closeSettings(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSettings(); });

  // ---------- 启动 ----------
  initTheme();
  $('key-toggle').classList.toggle('on', keyOn);
  initSpeech();
  loadPersonas();
  loadBook();
  loadSession();
</script>
</body>
</html>
