  // ---------- 聊天 ----------
  async function ask(q, parentId, ctx) {
    q = (q || '').trim();
    if (!q) return;
    const book = currentBook;                    // 记住这问属于哪本书，切书后据此作废
    stopSpeak();                                // 每次新提问都打断正在进行的语音/播客
    hideWelcome();
    const pid = parentId == null ? pendingParentId : parentId;   // 追问目标
    const quote = pendingQuote;
    clearReplyMode();
    if (pid != null && quote) {
      q = '关于你说「' + quote.replace(/\s+/g, ' ') + '」这句，' + q;
    }
    const persona = $('persona-select').value || 'default';
    const depth = $('depth-select').value || 'standard';
    const history = pid == null ? lastThreadHistory() : threadHistory(pid);
    // 追问锚定：追问时把「父回答引用的第一处出处」当 context 带过去，避免全局语义检索跑偏到别的话题
    let anchorCtx = ctx ? { text: ctx.text, heading: ctx.heading } : null;
    if (!anchorCtx && pid != null) {
      const pn = sessionNodes.find(n => n.id === pid);
      const srcs = pn && pn.sources;
      if (srcs && srcs.length) anchorCtx = { text: srcs[0].text || '', heading: srcs[0].heading || '' };
    }

    const userNode = { id: msgSeq++, role: 'user', content: q, parentId: pid == null ? null : pid };
    sessionNodes.push(userNode);
    addMsg('user', q, null, null, { id: userNode.id, parentId: userNode.parentId });
    input.value = '';
    resizeInput();

    const btn = $('send'); btn.disabled = true; const old = btn.textContent; btn.textContent = '…';
    const thinkingEl = addThinking();
    if (askAbort) askAbort.abort();             // 同一本书内连续提问，取消上一问
    const ac = new AbortController();
    askAbort = ac;
    let msgEl = null, sources = [], answerText = '', thinkingDone = false;
    try {
      const res = await fetch('/api/ask/stream', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ question: q, persona, depth, history, book, context: anchorCtx ? anchorCtx.text : '', heading: anchorCtx ? anchorCtx.heading : '' }),
        signal: ac.signal
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;
          let ev; try { ev = JSON.parse(line); } catch (e) { continue; }
          if (ev.type === 'sources') {
            sources = ev.sources || [];
            if (!thinkingDone) { removeThinking(thinkingEl); thinkingDone = true; }
            msgEl = addMsg('assistant', '', sources, q, { parentId: userNode.parentId });
          } else if (ev.type === 'delta') {
            answerText += ev.text;
            if (!thinkingDone) { removeThinking(thinkingEl); thinkingDone = true; }
            if (!msgEl) msgEl = addMsg('assistant', '', sources, q, { parentId: userNode.parentId });
            updateMsgAnswer(msgEl, answerText);
          }
        }
      }
      if (!thinkingDone) { removeThinking(thinkingEl); thinkingDone = true; }
      if (currentBook !== book) return;          // 切书了：这条回答作废，不写入任何书
      if (!msgEl) msgEl = addMsg('assistant', answerText || '（没有回答）', sources, q, { parentId: userNode.parentId });
      sessionNodes.push({ id: Number(msgEl.dataset.id), role: 'assistant', content: answerText, parentId: userNode.parentId, question: q, sources });
      if (sessionNodes.length > 200) sessionNodes = sessionNodes.slice(-200);
      markCoverage(sources);
      saveSession();
    } catch (err) {
      if (ac.signal.aborted) return;            // 被切书/连续提问取消，静默退出
      removeThinking(thinkingEl);
      if (msgEl) updateMsgAnswer(msgEl, answerText + '\n\n（请求失败：' + err + '）');
      else addMsg('assistant', '请求失败：' + err, null, null, { parentId: userNode.parentId });
    } finally {
      if (askAbort === ac) askAbort = null;
      btn.disabled = false; btn.textContent = old;
    }
  }
  function send() { ask(input.value); }

  function updateMsgAnswer(msgEl, text) {
    msgEl.dataset.a = text;
    const t = msgEl.querySelector('.msg-text');
    if (t) t.innerHTML = fmtAnswer(text);
    // 只有用户本来就贴近底部时才跟随滚动；往上翻着看时不被新字拽回去
    const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 120;
    if (nearBottom) messages.scrollTop = messages.scrollHeight;
  }

  function addMsg(role, text, sources, question, opts) {
    opts = opts || {};
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.dataset.id = String(opts.id != null ? opts.id : msgSeq++);
    if (role === 'assistant') {
      div.dataset.q = question || '';
      div.dataset.a = text || '';
      div.innerHTML = '<div class="msg-text">' + fmtAnswer(text || '') + '</div>' +
        '<div class="msg-tools"><button class="follow-up">追问</button><button class="suggest-more">追问灵感</button><button class="save-note">存为笔记</button><button class="read-aloud">朗读</button><button class="delete-msg">删除</button></div>';
    } else {
      div.innerHTML = esc(text) + '<button class="delete-msg user-del" title="删除这条">' + icon('x', 'sm') + '</button>';
    }
    if (sources && sources.length) {
      div.dataset.sources = JSON.stringify(sources);
      div.innerHTML += '<div class="sources">' + sources.map((s, i) =>
        '<div class="src">[' + (i + 1) + '] ' + esc(s.heading || '（无标题）') + '</div>').join('') + '</div>';
    }
    let container = messages;
    if (opts.parentId != null) {
      const parent = document.querySelector('.msg[data-id="' + opts.parentId + '"]');

  function fmtAnswer(text) {

  function citeClick(e) {

      const msg = save.closest('.msg.assistant');

      let node = null;
      for (const n of sessionNodes) if (n.id === Number(msg && msg.dataset.id)) { node = n; break; }
      const src = node && node.sources && node.sources[0];
      const heading = (src && src.heading) || '';
      const quote = (src && src.text) || '';
      let block = '### 问：' + q + '\n\n' + a;
      if (heading && heading !== '（无标题）') {
        block += '\n\n> ' + heading + (quote ? '：「' + quote.replace(/\s+/g, ' ').slice(0, 120) + '」' : '');

  // ---------- 会话持久化（刷新不丢聊天） ----------
  async function loadSession() {
    try {
      const res = await fetch('/api/session?book=' + encodeURIComponent(currentBook));
      const data = await res.json();
      const msgs = (data.messages || []).slice(-200);
      if (!msgs.length) return;
      sessionNodes = []; msgSeq = 0; welcomed = true;
      messages.innerHTML = '';
      msgs.forEach(m => {
        const hasId = m.id != null;
        const id = hasId ? Number(m.id) : msgSeq++;
        if (hasId) msgSeq = Math.max(msgSeq, id + 1);
        const node = {
          id,
          role: m.role,
          content: m.content || '',
          parentId: m.parentId == null ? null : Number(m.parentId),
          question: m.question || '',
          sources: m.sources || null
        };
        sessionNodes.push(node);
        addMsg(node.role, node.content, node.sources, node.question, { id: node.id, parentId: node.parentId });
      });
      messages.scrollTop = messages.scrollHeight;
    } catch (e) {}
  }
  async function saveSession() {
    try {
      await fetch('/api/session?book=' + encodeURIComponent(currentBook), {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ messages: sessionNodes })
      });
    } catch (e) {}
  }

  // ---------- 语音 & 播客：AI 讲（edge-tts 神经语音），你随时插嘴（STT 打断） ----------
  let speaking = false, speakingEl = null;
  let audioSeq = 0;
  let curAudio = null;
  // 朗读音色：默认男声「云健」，跟播客两位主播（小晓女声/小宇男声）区分开
  let readVoice = 'zh-CN-YunjianNeural';

  function speechText(s) {
    return String(s || '')
      .replace(/\[(\d+)\]/g, '')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\*([^*\s][^*]*)\*/g, '$1')
      .replace(/^\s{0,3}(?:[#>*+-]|\d+[.)])\s+/gm, '')
      .replace(/\n{2,}/g, '\n')
      .replace(/[ \t]{2,}/g, ' ');
  }
  function updateReadBtns() {
    document.querySelectorAll('.read-aloud').forEach(b => {
      b.textContent = (speaking && b === speakingEl) ? '停' : '朗读';
      b.classList.toggle('speaking', speaking && b === speakingEl);
    });
  }
  function cancelSpeech() {
    audioSeq++;
    if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio.src = ''; curAudio = null; }
    speaking = false; speakingEl = null; updateReadBtns();
  }
  function stopSpeak() {
    cancelSpeech();
  }
  async function speak(text, btn, onDone) {
    const clean = speechText(text);
    cancelSpeech();
    const mySeq = audioSeq;
    if (!clean.trim()) { if (onDone) onDone(); return; }
    speaking = true; speakingEl = btn || null; updateReadBtns();
    try {
      const res = await fetch('/api/tts', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ text: clean, voice: readVoice })
      });
      if (!res.ok) throw new Error('tts ' + res.status);
      const blob = await res.blob();
      if (mySeq !== audioSeq) return;      // 已被打断，丢弃
      const url = URL.createObjectURL(blob);
      const a = new Audio(url);
      curAudio = a;
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        URL.revokeObjectURL(url);
        if (mySeq !== audioSeq) return;
        speaking = false; speakingEl = null; updateReadBtns();
        if (onDone) onDone();
      };
      a.onended = finish;
      a.onerror = finish;
      a.play().catch(() => finish());      // 被自动播放策略拦了就结束这条，继续循环
    } catch (e) {
      if (mySeq !== audioSeq) return;
      speaking = false; speakingEl = null; updateReadBtns();
      console.warn('TTS 失败', e);
      if (onDone) onDone();                // 网络/接口失败：不卡住循环
    }
  }
  // ---------- 双人播客：读全书(免费) → 一次生成双人脚本 → 双音色合成 ----------
  let podcastBusy = false;
  let podcastScript = '';   // 当前正在播的脚本全文，插嘴时用来告诉主播「刚才播到哪」
  let podcastFormat = 'deep';    // 生成弹窗选中的格式（deep/brief/critique/debate）
  let podcastLen = 'medium';     // 生成弹窗选中的时长（short/medium/long）
  function setPodcastStatus(msg) { $('podcast-status').textContent = msg; }
  let podcastChaptersBook = '';
  function loadPodcastChapters() {
    if (podcastChaptersBook === currentBook) { updatePodcastChCount(); return; }
    const list = $('podcast-ch-list');
    list.innerHTML = '';
    fetch('/api/book/' + encodeURIComponent(currentBook) + '/headings')
      .then(r => r.json())
      .then(d => {
        (d.headings || []).forEach((h, i) => {
          const lab = document.createElement('label');
          lab.dataset.idx = i;

  function podcastChapters() {
    return Array.from($('podcast-ch-list').querySelectorAll('input:checked')).map(c => c.value);
  }
  function updatePodcastChCount() {
    const boxes = $('podcast-ch-list').querySelectorAll('input');
    if (!boxes.length) { $('podcast-ch-count').textContent = '全部章节'; return; }
    const checked = podcastChapters().length;
    $('podcast-ch-count').textContent = checked ? ('已选 ' + checked + '/' + boxes.length + ' 章') : '全部章节';
  }
  function loadPodcastLibrary() {
    fetch('/api/podcasts?book=' + encodeURIComponent(currentBook))
      .then(r => r.json())
      .then(d => {
        const list = $('podcast-lib-list');
        list.innerHTML = '';

        if (!items.length) { list.innerHTML = '<div class="pdl-empty">还没有保存的播客</div>'; return; }
        items.forEach(it => {

            setPodcastStatus('就绪 · ' + (it.title || ''));

          dl.onclick = () => {

          del.onclick = async () => { await fetch('/api/podcast/' + it.id, { method: 'DELETE' }); loadPodcastLibrary(); };

  function openPodcastBar() {
    const bar = $('podcast-bar');
    if (bar.classList.contains('show')) { bar.classList.remove('show'); $('podcast-options-overlay').classList.remove('show'); return; }
    bar.classList.add('show');

  async function makePodcast() {
    if (podcastBusy) return;
    podcastBusy = true;
    $('podcast-options-overlay').classList.remove('show');   // 生成时收起弹窗，露出底部播放条
    const len = podcastLen;
    const fmt = podcastFormat;
    const instructions = ($('podcast-instr').value || '').trim();
    const chapters = podcastChapters();
    $('podcast-audio').style.display = 'none';
    $('podcast-download').style.display = 'none';
    $('podcast-interrupt').style.display = 'none';
    $('podcast-auto').style.display = 'none';
    stopAutoListen();
    try {
      setPodcastStatus('① 写脚本…');
      const res = await fetch('/api/podcast?book=' + encodeURIComponent(currentBook), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ length: len, format: fmt, chapters, instructions })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '生成失败');
      podcastScript = data.script || '';
      setPodcastStatus('② 合成双音色音频…');
      const ares = await fetch('/api/podcast/audio', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ script: data.script, save: true, format: fmt, length: len, chapters, instructions })
      });
      if (!ares.ok) throw new Error('音频合成失败 ' + ares.status);
      const ad = await ares.json();
      if (!ad.ok || !ad.url) throw new Error(ad.error || '保存失败');
      const url = ad.url;
      const audio = $('podcast-audio');
      audio.src = url;
      audio.style.display = '';
      $('podcast-download').style.display = '';
      $('podcast-interrupt').style.display = '';
      $('podcast-auto').style.display = '';
      setPodcastStatus('就绪 · 已存入播客库');
      $('podcast-download').onclick = () => {
        const a = document.createElement('a');
        a.href = url; a.download = (ad.title || currentBook || '播客') + '.mp3';
        document.body.appendChild(a); a.click(); a.remove();
      };
      loadPodcastLibrary();
    } catch (e) {
      setPodcastStatus('失败：' + e.message);
    } finally {
      podcastBusy = false;
    }
  }
  function podcastInterrupt() {
    const main = $('podcast-audio');
    if (!main.src) { toast('先生成播客'); return; }
    main.pause();
    stopAutoListen();   // 手动插嘴时停掉自动监听，避免两个麦克风同时开
    stopSpeak();
    setPodcastStatus('你说，我听着…（说完自动转写）');
    (async () => {
      try {
        const blob = await startRecording('podcast');
        setPodcastStatus('听到了，转写中…');
        const text = await transcribe(blob);
        if (text) podcastAnswer(text, main);
        else { setPodcastStatus('没听清，继续播'); main.play().catch(() => {}); }
      } catch (e) {
        setPodcastStatus('麦克风不可用，继续播'); main.play().catch(() => {});
      }
    })();
  }
  function _podcastTurns(script) {
    const turns = [];
    let v = '小晓：', cur = [];
    for (const raw of (script || '').split('\n')) {
      const line = raw.trim();
      if (!line) continue;
      const a = line.match(/^(?:小晓|晓晓|小A|A|主播A)[：:]\s*(.*)$/);
      if (a) { if (cur.length) turns.push([v, cur.join('')]); cur = []; v = '小晓：'; cur.push(a[1]); continue; }
      const b = line.match(/^(?:小宇|宇宇|小B|B|主播B)[：:]\s*(.*)$/);
      if (b) { if (cur.length) turns.push([v, cur.join('')]); cur = []; v = '小宇：'; cur.push(b[1]); continue; }
      cur.push(line);
    }
    if (cur.length) turns.push([v, cur.join('')]);
    const out = [];
    for (const [vv, t] of turns) {
      const tt = t.trim();
      if (!tt) continue;
      if (out.length && out[out.length - 1][0] === vv) out[out.length - 1][1] += tt;
      else out.push([vv, tt]);
    }
    return out;
  }
  function resumePodcast(main, at) {
    if (!main.src) { setPodcastStatus('就绪'); return; }
    try { main.currentTime = Math.max(0, at); } catch (e) {}
    main.volume = 0;
    setPodcastStatus('就绪 · 继续播');
    const p = main.play();
    if (p && p.then) p.catch(() => { main.volume = 1; });
    const t0 = performance.now();
    const ramp = () => {
      const k = Math.min(1, (performance.now() - t0) / 1500);
      main.volume = k;
      if (k < 1) requestAnimationFrame(ramp);
    };
    requestAnimationFrame(ramp);
  }
  function podcastContextAt(main) {
    if (!podcastScript) return '';
    const dur = main.duration || 0;
    const t = main.currentTime || 0;
    const frac = dur > 0 ? Math.min(1, Math.max(0, t / dur)) : 0;
    const pos = Math.floor(frac * podcastScript.length);
    return podcastScript.slice(Math.max(0, pos - 180), pos).replace(/\s+/g, ' ').trim();
  }
  // 按句续播：把脚本按句切分，用字符比例近似每句在音频里的位置（同一音色语速大致恒定）。
  // 返回每句「开始位置比例」(0..1) 的升序数组。
  function podcastSentenceStarts(script) {
    const flat = (script || '')
      .split('\n')
      .map(l => l.replace(/^(?:小晓|晓晓|小A|A|主播A|小宇|宇宇|小B|B|主播B)[：:]\s*/, '').trim())
      .filter(Boolean)
      .join('');
    if (!flat) return [];
    const sents = flat.match(/[^。！？；!?;]+[。！？；!?;]?/g) || [flat];
    const total = flat.length || 1;
    const starts = [];
    let acc = 0;
    for (const s of sents) { starts.push(acc / total); acc += s.length; }
    return starts;
  }
  // 当前播放位置所在的句子的「句首时间」，用来续播（而不是硬回退 8 秒）。
  function sentenceResumeTime(main) {
    const dur = main.duration || 0;
    const t = main.currentTime || 0;
    if (!dur || !podcastScript) return Math.max(0, t - 8);
    const frac = Math.min(1, Math.max(0, t / dur));
    const starts = podcastSentenceStarts(podcastScript);
    if (!starts.length) return 0;
    let cur = 0;
    for (const s of starts) { if (s <= frac + 1e-9) cur = s; else break; }
    return cur * dur;
  }
  async function podcastAnswer(q, main) {
    setPodcastStatus('主播在想…');
    // 按句续播：回到「正在播的那一句」的句首，而不是硬回退 8 秒
    const resumeAt = sentenceResumeTime(main);
    const context = podcastContextAt(main);
    try {
      const r = await fetch('/api/podcast/answer/stream?book=' + encodeURIComponent(currentBook), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, context })
      });
      if (!r.ok || !r.body) throw new Error('接口失败 ' + r.status);
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let playChain = Promise.resolve();   // 按顺序播放各轮
      let firstAudioStarted = false;
      let errorMsg = '';
      function enqueueTurn(voice, text) {
        // 每轮边生成边合成（并行），但按顺序播放：第一句好了就立刻出声
        const tts = fetch('/api/podcast/audio', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script: voice + text })
        }).then(async res => {
          if (!res.ok) throw new Error('合成失败 ' + res.status);
          return URL.createObjectURL(await res.blob());
        });
        playChain = playChain.then(() => tts).then(async url => {
          await new Promise((resolve) => {
            const a = new Audio(url);
            a.onended = () => { URL.revokeObjectURL(url); resolve(); };
            a.onerror = () => { URL.revokeObjectURL(url); resolve(); };
            a.play().catch(() => { URL.revokeObjectURL(url); resolve(); });
          });
        }).catch(() => {});
      }
      function handleLine(line) {
        line = line.trim();
        if (!line) return;
        let ev;
        try { ev = JSON.parse(line); } catch (e) { return; }
        if (ev.type === 'turn' && ev.t) {
          if (!firstAudioStarted) { firstAudioStarted = true; setPodcastStatus('主播回答…'); }
          enqueueTurn(ev.v || '小晓：', ev.t);
        } else if (ev.type === 'error') {
          errorMsg = ev.error || '没答上';
        }
      }
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          handleLine(buf.slice(0, nl));
          buf = buf.slice(nl + 1);
        }
      }
      if (buf) handleLine(buf);   // 万一最后一行没换行
      await playChain;
      if (errorMsg && !firstAudioStarted) throw new Error(errorMsg);
      resumePodcast(main, resumeAt);
    } catch (e) {
      setPodcastStatus('失败：' + e.message);
      resumePodcast(main, resumeAt);
    }
  }

  // ---------- 本地语音：录音（MediaRecorder）→ 本地 Whisper 转写（/api/stt） ----------
  // 不依赖 Chrome SpeechRecognition（它走 Google 服务器，部分地区连不上会一直卡在「正在听」）。
  let micStream = null, audioCtx = null, analyser = null;
  let mediaRec = null, recChunks = [], recMonTimer = null, recMaxTimer = null;
  let recHeard = false, recSilenceMs = 0, recTarget = 'chat';
  let podcastAutoOn = false;      // 用户是否开了「自动插嘴」
  let autoMonTimer = null;        // 自动插嘴的能量监听循环
  const SPEECH_LEVEL = 0.035;     // 有声音的能量阈值
  const SILENCE_END_MS = 1500;    // 连续静音这么久判定「说完了」
  const MAX_REC_MS = 20000;       // 最长录音兜底
  const MIC_HINT = '问这本书任何问题，回车发送（Shift+回车换行）';

  async function ensureMic() {
    if (micStream) return micStream;
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    return micStream;
  }
  function currentLevel() {
    if (!analyser) return 0;
    const buf = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
    return Math.sqrt(sum / buf.length);
  }
  function pickMime() {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) return 'audio/webm;codecs=opus';
    if (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm')) return 'audio/webm';
    return '';
  }
  function isRecording() { return !!(mediaRec && mediaRec.state === 'recording'); }
  function clearRecTimers() {
    if (recMonTimer) { clearInterval(recMonTimer); recMonTimer = null; }
    if (recMaxTimer) { clearTimeout(recMaxTimer); recMaxTimer = null; }
  }
  function stopRecording() {
    if (mediaRec && mediaRec.state !== 'inactive') { try { mediaRec.stop(); } catch (e) {} }
  }
  function setMicState(state) {
    const b = $('mic');
    b.classList.remove('listening', 'heard', 'transcribing');
    if (state === 'listening') b.classList.add('listening');
    else if (state === 'heard') b.classList.add('heard');
    else if (state === 'transcribing') b.classList.add('transcribing');
    const track = $('mic-level-track');
    if (track) track.style.display = (state === 'listening' || state === 'heard') ? '' : 'none';
  }
  function onMicLevel(lvl) {
    const meter = $('mic-level');
    if (meter) meter.style.width = Math.round(Math.min(1, lvl * 6) * 100) + '%';
  }
  function onMicHeard() {
    if (recTarget === 'chat') setMicState('heard');
    else setPodcastStatus('听到了 · 继续说…');
  }
  // 开始录音：静音自动停，resolve 成音频 Blob；出错 reject 成中文提示
  function startRecording(target) {
    return new Promise(async (resolve, reject) => {
      try { await ensureMic(); } catch (e) { reject('麦克风不可用'); return; }
      recChunks = []; recHeard = false; recSilenceMs = 0; recTarget = target;
      const mime = pickMime();
      mediaRec = new MediaRecorder(micStream, mime ? { mimeType: mime } : undefined);
      mediaRec.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
      mediaRec.onstop = () => {
        clearRecTimers();
        const blob = new Blob(recChunks, { type: mediaRec.mimeType || 'audio/webm' });
        mediaRec = null;
        resolve(blob);
      };
      try { mediaRec.start(200); } catch (e) { mediaRec = null; reject('录音启动失败'); return; }
      recMonTimer = setInterval(() => {
        const lvl = currentLevel();
        onMicLevel(lvl);
        if (lvl >= SPEECH_LEVEL) {
          if (!recHeard) { recHeard = true; onMicHeard(); }
          recSilenceMs = 0;
        } else if (recHeard) {
          recSilenceMs += 200;
          if (recSilenceMs >= SILENCE_END_MS) stopRecording();
        }
      }, 200);
      recMaxTimer = setTimeout(() => stopRecording(), MAX_REC_MS);
    });
  }
  async function transcribe(blob) {
    const res = await fetch('/api/stt', { method: 'POST', headers: { 'Content-Type': blob.type || 'audio/webm' }, body: blob });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '语音识别失败');
    return (data.text || '').trim();
  }
  function micHint(msg) {
    input.placeholder = msg + '，再点一次麦克风试试';
    setTimeout(() => { input.placeholder = MIC_HINT; }, 4000);
  }

  // 聊天：点一下开始收音，说完自动停 → 本地转写 → 发送
  $('mic').addEventListener('click', async () => {
    if (isRecording()) { stopRecording(); return; }   // 再点 = 手动停
    stopSpeak();
    setMicState('listening');
    micHint('收音中，说完了我会自动停…');
    try {
      const blob = await startRecording('chat');
      setMicState('transcribing');
      micHint('听到了，转写中…');
      const text = await transcribe(blob);
      setMicState('idle');
      if (text) { input.value = text; resizeInput(); ask(input.value); }
      else micHint('没听清');
    } catch (e) {
      setMicState('idle');
      micHint(e && e.message ? e.message : '语音识别失败');
    }
  });

  // ---------- 播客自动插嘴：播放时保持「能量监听」，一开口就暂停并回答 ----------
  function podcastPlaying() {
    const a = $('podcast-audio');
    return !!a.src && !a.paused;
  }
  function stopAutoListen() {
    if (autoMonTimer) { clearInterval(autoMonTimer); autoMonTimer = null; }
    if (recTarget === 'podcast-auto' && isRecording()) stopRecording();
  }
  async function armAutoListen() {
    if (!podcastAutoOn || !podcastPlaying() || autoMonTimer || isRecording()) return;
    try { await ensureMic(); } catch (e) { setPodcastAuto(false); toast('麦克风不可用，自动插嘴已关闭'); return; }
    autoMonTimer = setInterval(async () => {
      if (!podcastAutoOn || !podcastPlaying()) { stopAutoListen(); return; }
      if (currentLevel() >= SPEECH_LEVEL) {
        stopAutoListen();
        const main = $('podcast-audio');
        main.pause();
        setPodcastStatus('听到了，主播准备接…');
        try {
          const blob = await startRecording('podcast-auto');
          setPodcastStatus('转写中…');
          const text = await transcribe(blob);
          if (text) podcastAnswer(text, main);   // 回答完 resumePodcast → play 事件 → 重新 arm
          else resumePodcast(main, 0);
        } catch (e) { resumePodcast(main, 0); }
      }
    }, 200);
  }
  function setPodcastAuto(on) {
    podcastAutoOn = on;
    const b = $('podcast-auto');
    b.classList.toggle('on', on);
    b.innerHTML = icon('headphones') + ' ' + (on ? '自动插嘴中' : '自动插嘴');
    if (on) armAutoListen(); else stopAutoListen();
  }
  $('podcast').addEventListener('click', openPodcastBar);
  $('podcast-make').addEventListener('click', makePodcast);
  $('podcast-more').addEventListener('click', () => $('podcast-more-menu').classList.toggle('show'));
  $('podcast-options-btn').addEventListener('click', () => { $('podcast-options-overlay').classList.toggle('show'); $('podcast-more-menu').classList.remove('show'); });
  $('podcast-lib-btn').addEventListener('click', () => { $('podcast-library').classList.toggle('show'); loadPodcastLibrary(); $('podcast-more-menu').classList.remove('show'); });
  $('podcast-lib-refresh').addEventListener('click', loadPodcastLibrary);
  // 生成弹窗：格式卡片 + 时长分段 + 关闭
  document.querySelectorAll('#podcast-options .pf-card').forEach(c => {
    c.addEventListener('click', () => {
      podcastFormat = c.dataset.fmt;
      document.querySelectorAll('#podcast-options .pf-card').forEach(x => x.classList.toggle('sel', x === c));
    });
  });
  document.querySelectorAll('#podcast-len-group button').forEach(b => {
    b.addEventListener('click', () => {
      podcastLen = b.dataset.len;
      document.querySelectorAll('#podcast-len-group button').forEach(x => x.classList.toggle('sel', x === b));
    });
  });
  $('podcast-options-close').addEventListener('click', () => $('podcast-options-overlay').classList.remove('show'));
  $('podcast-options-overlay').addEventListener('mousedown', (e) => { if (e.target === $('podcast-options-overlay')) $('podcast-options-overlay').classList.remove('show'); });
  $('podcast-ch-toggle').addEventListener('click', () => {
    const w = $('podcast-ch-wrap');
    w.style.display = w.style.display === 'none' ? '' : 'none';
    loadPodcastChapters();
  });
  $('podcast-ch-clear').addEventListener('click', () => {
    $('podcast-ch-list').querySelectorAll('input').forEach(c => { c.checked = false; });
    updatePodcastChCount();
  });
  $('podcast-ch-list').addEventListener('change', updatePodcastChCount);

  // ---------- 播客选篇章：长按 300ms 进入拖选，向下拖过的一串章节跟随起始项状态 ----------
  let podcastDrag = null;        // { startIdx, toState, active }
  let suppressChClick = false;   // 拖选结束后的那次 click 要吞掉，避免把起始项又翻回去
  const PODCAST_DRAG_DELAY = 300;
  function podcastChLabels() { return Array.from($('podcast-ch-list').querySelectorAll('label')); }
  $('podcast-ch-list').addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;   // 只响应左键
    const startLab = e.target.closest ? e.target.closest('label') : null;
    if (!startLab) return;
    const startIdx = Number(startLab.dataset.idx);
    let entered = false;
    const timer = setTimeout(() => {
      entered = true;
      const cb = startLab.querySelector('input');
      const toState = !cb.checked;
      cb.checked = toState;
      podcastDrag = { startIdx, toState, active: true };
      suppressChClick = true;
      $('podcast-ch-list').classList.add('drag-sel');
      try { $('podcast-ch-list').setPointerCapture(e.pointerId); } catch (err) {}
    }, PODCAST_DRAG_DELAY);

    const onMove = (ev) => {
      if (!entered || !podcastDrag) return;
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const hit = el && el.closest ? el.closest('#podcast-ch-list label') : null;
      if (!hit) return;
      const hi = Number(hit.dataset.idx);
      const lo = Math.min(podcastDrag.startIdx, hi), top = Math.max(podcastDrag.startIdx, hi);
      podcastChLabels().forEach((l, i) => {
        if (i >= lo && i <= top) l.querySelector('input').checked = podcastDrag.toState;
      });
    };
    const onUp = () => {
      clearTimeout(timer);
      if (entered && podcastDrag) {
        podcastDrag = null;
        $('podcast-ch-list').classList.remove('drag-sel');
        try { $('podcast-ch-list').releasePointerCapture(e.pointerId); } catch (err) {}
        updatePodcastChCount();
        setTimeout(() => { suppressChClick = false; }, 0);   // 兜底：万一没触发 click 也清掉
      }
      $('podcast-ch-list').removeEventListener('pointermove', onMove);
      $('podcast-ch-list').removeEventListener('pointerup', onUp);
      $('podcast-ch-list').removeEventListener('pointercancel', onUp);
    };
    $('podcast-ch-list').addEventListener('pointermove', onMove);
    $('podcast-ch-list').addEventListener('pointerup', onUp);
    $('podcast-ch-list').addEventListener('pointercancel', onUp);
  });
  // 拖选结束那次 click（浏览器默认勾选）要吞掉：我们已在拖选里手动设了 checkbox
  $('podcast-ch-list').addEventListener('click', (e) => {
    if (!suppressChClick) return;
    suppressChClick = false;
    e.preventDefault();
  }, true);
  $('podcast-interrupt').addEventListener('click', podcastInterrupt);
  $('podcast-auto').addEventListener('click', () => setPodcastAuto(!podcastAutoOn));
  $('podcast-audio').addEventListener('play', () => { if (podcastAutoOn) armAutoListen(); });
  $('podcast-audio').addEventListener('ended', () => { stopAutoListen(); });
  $('podcast-close').addEventListener('click', () => {
    $('podcast-audio').pause();
    stopAutoListen();
    $('podcast-bar').classList.remove('show');
    $('podcast-options-overlay').classList.remove('show');
    $('podcast-library').classList.remove('show');
    $('podcast-more-menu').classList.remove('show');
  });


  // ---------- 笔记（Vditor 所见即所得，底层存 Markdown） ----------
  let vditor = null;
  let noteEditTimer = null;
  function syncVditorTheme() {
    if (vditor && vditor.setTheme) { try { vditor.setTheme(isDarkMode() ? 'dark' : 'classic'); } catch (e) {} }
  }
  function initNotes() {
    if (vditor || $('notes-editor').querySelector('textarea')) return;
    try {
      vditor = new Vditor('notes-editor', {
        mode: 'wysiwyg',
        lang: 'zh_CN',
        cache: { enable: false },
        height: '100%',
        theme: isDarkMode() ? 'dark' : 'classic',
        toolbar: [
          'headings', 'bold', 'italic', 'strike', '|',
          'list', 'ordered-list', 'check', 'quote', 'inline-code', 'code', 'link', 'table', '|',
          'undo', 'redo', '|', 'outline', 'fullscreen'
        ],
        input: (value) => {
          noteContent = value || '';
          updateNoteCount();
          clearTimeout(noteEditTimer);
          noteEditTimer = setTimeout(() => saveNotes(false), 900);
        },
        after: () => { loadNotes(); }
      });
    } catch (e) {
      console.warn('Vditor 加载失败，退回纯文本', e);
      $('notes-editor').innerHTML = '<textarea id="notes-editor-txt" style="width:100%;height:100%;border:none;padding:30px 40px;font:inherit;font-size:16px;line-height:1.9;resize:none"></textarea>';
      $('notes-editor-txt').addEventListener('input', function () { noteContent = this.value; updateNoteCount(); saveNotes(false); });
    }
  }
  async function loadNotes() {
    try {
      const res = await fetch('/api/notes?book=' + encodeURIComponent(currentBook));
      const data = await res.json();
      noteContent = data.content || '';
      if (vditor) vditor.setValue(noteContent);
      updateNoteCount();
    } catch (e) {}
  }
  function updateNoteCount() {
    const n = String(noteContent || '').replace(/\s/g, '').length;
    $('notes-count').textContent = n ? n + ' 字' : '';
  }
  async function saveNotes(showStatus) {
    try {
      const res = await fetch('/api/notes?book=' + encodeURIComponent(currentBook), {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ content: noteContent })
      });
      const data = await res.json();
      if (showStatus !== false) {
        $('notes-status').textContent = data.ok ? '已保存' : '保存失败';
        setTimeout(() => { $('notes-status').textContent = ''; }, 1500);
      }
    } catch (e) {
      $('notes-status').textContent = '保存失败';
    }
  }
  async function appendToNote(mdtext) {
    if (!noteContent.trim()) {
      noteContent = '# 我的笔记 · ' + ($('book-title').textContent || '这本书') + '\n';
    }
    noteContent += '\n' + mdtext + '\n';
    if (vditor) vditor.setValue(noteContent);
    updateNoteCount();
    await saveNotes(false);
    $('notes-status').textContent = '已写入笔记';
    setTimeout(() => { $('notes-status').textContent = ''; }, 1500);
  }
  function downloadNote(name, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    $('messages').style.display = name === 'chat' ? 'flex' : 'none';
    $('composer').style.display = name === 'chat' ? 'flex' : 'none';
    $('pane-notes').style.display = name === 'notes' ? 'flex' : 'none';
    if (name === 'notes') { initNotes(); loadNotes(); }
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  $('note-download').addEventListener('click', () => {
    saveNotes(false);
    downloadNote('笔记.md', noteContent, 'text/markdown;charset=utf-8');
  });
  $('note-download-html').addEventListener('click', () => {
    const html = vditor ? (vditor.getHTML() || '') : '';
    downloadNote('笔记.html', '<!doctype html><meta charset="utf-8"><title>笔记</title>' + html, 'text/html;charset=utf-8');
  });
  $('note-copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(noteContent); $('notes-status').textContent = '已复制'; }
    catch (e) { $('notes-status').textContent = '复制失败'; }
    setTimeout(() => { $('notes-status').textContent = ''; }, 1500);
  });

  // ---------- 自动整理：按章节归位 + 溯源 + 保留上下文（可撤销） ----------
  let preOrganize = '';
  async function organizeNotes() {
    if (!noteContent.trim()) {
      $('notes-status').textContent = '还没有笔记可整理';
      setTimeout(() => { $('notes-status').textContent = ''; }, 1500);
      return;
    }
    const btn = $('note-organize');
    btn.disabled = true;
    btn.textContent = '整理中…';
    const s = coverageStats();
    const progress = '已读 ' + s.m + ' / 共 ' + s.total + ' 章 · 讨论 ' + s.d + ' · 深读 ' + s.c;
    try {
      const res = await fetch('/api/notes/organize?book=' + encodeURIComponent(currentBook), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: noteContent, progress })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '整理失败');
      preOrganize = noteContent;
      noteContent = data.content || noteContent;
      if (vditor) vditor.setValue(noteContent);
      updateNoteCount();
      await saveNotes(false);
      btn.innerHTML = icon('history') + ' 撤销整理';
      btn.dataset.undo = '1';
      $('notes-status').textContent = '已整理（可撤销）';
      setTimeout(() => { $('notes-status').textContent = ''; }, 4000);
    } catch (e) {
      btn.innerHTML = icon('sparkles') + ' 自动整理';
      $('notes-status').textContent = '整理失败：' + e.message;
      setTimeout(() => { $('notes-status').textContent = ''; }, 4000);
    } finally {
      btn.disabled = false;
    }
  }
  $('note-organize').addEventListener('click', () => {
    const btn = $('note-organize');
    if (btn.dataset.undo) {
      noteContent = preOrganize || noteContent;
      if (vditor) vditor.setValue(noteContent);
      updateNoteCount();
      saveNotes(false);
      preOrganize = '';
      btn.dataset.undo = '';
      btn.innerHTML = icon('sparkles') + ' 自动整理';
      $('notes-status').textContent = '已撤销';
      setTimeout(() => { $('notes-status').textContent = ''; }, 1500);
      return;
    }
    organizeNotes();
  });

  // ---------- 跟着读（主动阅读循环：节奏 + 主动回忆 + 复盘） ----------
  let guideSections = [];     // 每段 = 一个标题 + 其下若干段
  let guideIdx = -1;          // 当前读到第几段
  let guideQuestion = '';     // 「考考我」出的问题，提交答案时带回给 AI 评价
  let guideSummaryCache = {}; // 每段的总结缓存（key=标题/首段 id），回退不重复调 API

  function buildSections() {
    const sections = [];
    let cur = null;
    for (const el of bookContent.children) {
      if (el.classList.contains('heading')) {
        cur = { heading: el.textContent.trim(), headingEl: el, segs: [] };
        sections.push(cur);
      } else if (el.classList.contains('seg')) {
        if (!cur) { cur = { heading: '（开篇）', headingEl: null, segs: [] }; sections.push(cur); }
        cur.segs.push(el);
      }
    }
    sections.forEach(s => {
      const segText = s.segs.map(e => e.dataset.plain || e.textContent).join('\n');
      const head = (s.heading && s.heading !== '（开篇）') ? s.heading + '。' : '';
      s.text = head + segText;
      s.preview = segText.replace(/\s+/g, ' ').slice(0, 140);
    });
    return sections;
  }
  function currentSection() {
    if (!guideSections.length) return null;
    if (guideIdx < 0 || guideIdx >= guideSections.length) guideIdx = 0;
    return guideSections[guideIdx];
  }
  function currentSectionIndex() {
    const top = bookContent.getBoundingClientRect().top + 60;
    let idx = 0;
    for (let i = 0; i < guideSections.length; i++) {
      const el = guideSections[i].headingEl || guideSections[i].segs[0];
      if (!el) continue;
      if (el.getBoundingClientRect().top <= top) idx = i; else break;
    }
    return idx;
  }
  function clearGuideHighlight() {
    document.querySelectorAll('#book-content .guide-cur').forEach(el => el.classList.remove('guide-cur'));
  }
  function highlightCurrent() {
    clearGuideHighlight();
    if (!guideHl) return;
    const s = currentSection();
    if (!s) return;
    const els = s.headingEl ? [s.headingEl, ...s.segs] : s.segs;
    els.forEach(el => el.classList.add('guide-cur'));
  }
  function showGuideAnswer() { $('guide-answer-wrap').style.display = 'flex'; $('guide-answer').value = ''; $('guide-answer').focus(); }
  function hideGuideAnswer() { $('guide-answer-wrap').style.display = 'none'; }
  function closeGuide() { $('guide-panel').style.display = 'none'; clearGuideHighlight(); }

  // 读完一段的轻庆祝：撒花（无依赖）+ 一句提醒
  function celebrate() {
    const host = $('sidebar');
    const colors = ['#0071e3', '#e8a33d', '#34c759', '#ff6b6b', '#a78bfa', '#f5a623'];
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('span');
      s.className = 'confetti';
      s.style.background = colors[Math.floor(Math.random() * colors.length)];
      s.style.left = (8 + Math.random() * 82) + '%';
      s.style.animationDelay = (Math.random() * 0.4) + 's';
      const sz = (8 + Math.random() * 12) + 'px';
      s.style.width = sz; s.style.height = sz;
      host.appendChild(s);
      setTimeout(() => s.remove(), 2600);
    }
  }
  let toastTimer = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2800);
  }

  function guideCacheKey(s) {
    return s.heading || (s.segs[0] && s.segs[0].id) || ('sec' + guideIdx);
  }
  async function renderGuideSummary(s) {
    const preview = $('guide-chunk-preview');
    const key = guideCacheKey(s);
    if (guideSummaryCache[key]) { preview.innerHTML = fmtAnswer(guideSummaryCache[key]); return; }
    preview.innerHTML = '<span class="guide-thinking">正在总结这一段…</span>';
    try {
      const text = await guideStream({
        context: s.text, heading: s.heading, mode: 'summarize',
        persona: $('persona-select').value || 'default', book: currentBook
      }, preview);
      if (text.trim()) guideSummaryCache[key] = text;
    } catch (e) {
      preview.innerHTML = '<span class="muted">总结失败：' + esc(e) + '</span>';
    }
  }
  function renderGuideChunk() {
    const s = currentSection();
    if (!s) { $('guide-body').innerHTML = '<div class="guide-thinking">这本书还没有可读内容</div>'; return; }
    $('guide-title').textContent = '跟着读 · 第 ' + (guideIdx + 1) + ' 段';
    $('guide-chunk-heading').textContent = s.heading || '（未分章）';
    $('guide-body').innerHTML = '';
    hideGuideAnswer();
    guideQuestion = '';
    highlightCurrent();
    const src = $('guide-chunk-src');
    src.textContent = s.text;
    src.style.display = 'none';
    const srcToggle = $('guide-src-toggle');
    srcToggle.textContent = '看原文';
    srcToggle.style.display = '';
    renderGuideSummary(s);
    (s.headingEl || s.segs[0]).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function guideStream(body, targetEl) {
    const res = await fetch('/api/guide', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        let ev; try { ev = JSON.parse(line); } catch (e) { continue; }
        if (ev.type === 'delta') { text += ev.text; targetEl.innerHTML = fmtAnswer(text); }
      }
    }
    return text;
  }

  async function guideAction(mode) {
    const s = currentSection();
    if (!s) return;
    hideGuideAnswer();
    const bodyEl = $('guide-body');
    bodyEl.innerHTML = '<div class="guide-thinking">' + (mode === 'quiz' ? '在想怎么考你…' : '…') + '</div>';
    try {
      const text = await guideStream({
        context: s.text, heading: s.heading, mode,
        persona: $('persona-select').value || 'default', book: currentBook
      }, bodyEl);
      if (mode === 'quiz') { guideQuestion = text.trim(); showGuideAnswer(); }
    } catch (e) {
      bodyEl.innerHTML = '<div class="muted">出错了：' + esc(e) + '</div>';
    }
  }

  async function submitGuideAnswer() {
    const s = currentSection();
    const ans = $('guide-answer').value.trim();
    if (!s || !ans) return;
    hideGuideAnswer();
    const bodyEl = $('guide-body');
    bodyEl.innerHTML = '<div class="guide-thinking">…</div>';
    try {
      await guideStream({
        context: s.text, heading: s.heading, mode: 'evaluate',
        question: guideQuestion, answer: ans,
        persona: $('persona-select').value || 'default', book: currentBook
      }, bodyEl);
    } catch (e) {
      bodyEl.innerHTML = '<div class="muted">出错了：' + esc(e) + '</div>';
    }
  }

  async function runGuideRecap() {
    const bodyEl = $('guide-body');
    hideGuideAnswer();
    guideQuestion = '';
    clearGuideHighlight();
    $('guide-title').textContent = '复盘';
    $('guide-chunk-heading').textContent = '我读到哪了？';
    $('guide-chunk-preview').textContent = '';
    $('guide-src-toggle').style.display = 'none';
    $('guide-chunk-src').style.display = 'none';
    bodyEl.innerHTML = '<div class="guide-thinking">在回想你读到哪了…</div>';
    try {
      const s = coverageStats();
      const recent = sessionNodes.slice(-6).map(n =>
        (n.role === 'user' ? '你问：' : '我答：') + (n.content || '').replace(/\s+/g, ' ').slice(0, 120)
      ).join('\n');
      const context = '已读进度：约 ' + s.pct + '%（已读 ' + s.m + ' / 共 ' + s.total + ' 章，讨论 ' + s.d + ' · 深读 ' + s.c + '）\n最近对话：\n' + (recent || '（还没有对话）');
      await guideStream({
        context, heading: currentBook, mode: 'recap',
        persona: $('persona-select').value || 'default', book: currentBook
      }, bodyEl);
    } catch (e) {
      bodyEl.innerHTML = '<div class="muted">出错了：' + esc(e) + '</div>';
    }
  }

  function openGuide(mode) {
    guideSections = buildSections();
    if (!guideSections.length) { closeGuide(); return; }
    guideIdx = currentSectionIndex();
    $('guide-panel').style.display = 'flex';
    $('guide-hl-toggle').classList.toggle('on', guideHl);
    $('guide-hl-toggle').textContent = guideHl ? '高亮' : '高亮已关';
    if (mode === 'recap') runGuideRecap(); else renderGuideChunk();
  }

  $('guide-open').addEventListener('click', () => openGuide('chunk'));
  $('guide-recap-btn').addEventListener('click', () => openGuide('recap'));
  $('guide-close').addEventListener('click', closeGuide);
  $('guide-src-toggle').addEventListener('click', () => {
    const src = $('guide-chunk-src');
    const show = src.style.display === 'none';
    src.style.display = show ? '' : 'none';
    $('guide-src-toggle').textContent = show ? '收起原文' : '看原文';
  });
  $('guide-hl-toggle').addEventListener('click', () => {
    guideHl = !guideHl;
    saveJSON('bt-guide-hl', guideHl);
    $('guide-hl-toggle').classList.toggle('on', guideHl);
    $('guide-hl-toggle').textContent = guideHl ? '高亮' : '高亮已关';
    highlightCurrent();
  });
  $('guide-next').addEventListener('click', () => {
    celebrate();
    toast('读完这一段啦，要不要聊聊 / 考考我？');
    guideIdx++;
    renderGuideChunk();
  });
  $('guide-discuss').addEventListener('click', () => {
    const s = currentSection();
    if (!s) return;
    switchTab('chat');
    ask('我刚读完这一段，想跟你聊聊：先一句话点出它最关键的一点，再问我一个问题让我参与进来（比如我的看法、联想到什么）。', null, { text: s.text, heading: s.heading });
  });
  $('guide-quiz').addEventListener('click', () => guideAction('quiz'));
  $('guide-submit').addEventListener('click', submitGuideAnswer);
  $('guide-answer').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitGuideAnswer(); }
  });

  // ---------- 设置面板 ----------
  function openSettings() {
    $('settings-overlay').style.display = 'flex';
    refreshSettingsStatus();
  }
  function closeSettings() { $('settings-overlay').style.display = 'none'; }
  async function refreshSettingsStatus() {
    const el = $('settings-key-status');
    try {
      const res = await fetch('/api/settings');
      const s = await res.json();
      el.textContent = s.has_key ? ('已配置 · 模型 ' + s.model) : '尚未配置，请粘贴你的 API Key';
      el.className = s.has_key ? 'ok' : 'warn';
      if (!s.has_key) $('settings-key').value = '';
    } catch (e) {
      el.textContent = '读取设置失败';
      el.className = 'warn';
    }
  }
  async function saveSettingsKey() {
    const key = $('settings-key').value.trim();
    if (!key) { toast('请先粘贴 API Key'); return; }
    const res = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ api_key: key }) });
    const r = await res.json();
    if (r.ok) { toast('已保存，下次问答即用新 Key'); $('settings-key').value = ''; refreshSettingsStatus(); }
    else { toast(r.error || '保存失败'); }
  }
  $('settings-btn').addEventListener('click', openSettings);
  $('settings-close').addEventListener('click', closeSettings);
  $('settings-key-save').addEventListener('click', saveSettingsKey);
  $('settings-overlay').addEventListener('mousedown', (e) => { if (e.target === $('settings-overlay')) closeSettings(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSettings(); });

  // ---------- 启动 ----------
  decorateIcons();
  initTheme();
  applyReading();
  $('key-toggle').classList.toggle('on', keyOn);
  attachDockMagnify($('progress-ticks'), '.bm-tick');
  attachDockMagnify($('rail-overview'), '.rl-ch, .rail-card', { axis: 'y', maxScale: 1.18, radius: 150 });
  setRailCollapsed(false);
  loadPersonas();
  loadBook();
  loadSession();
</script>
</body>
</html>
